:root {
  /* Palette · from the couple's wedding colors */
  --ivory: #f7f0e7;
  --ivory-deep: #efe3d4;
  --blush: #e9c3bc;
  --blush-soft: #f4dfd9;
  --prosecco: #dcc393;
  --prosecco-deep: #9c7b43;
  --plum: #4f1a3e;
  --plum-deep: #2a0c1f;
  --ink: #1a1216;
  --ink-soft: #5d4a52;

  /* Type */
  --serif: "Bodoni Moda", "Bodoni 72", Didot, "Didot LT STD", Georgia, serif;
  --sans: "Jost", "Futura PT", Futura, "Avenir Next", "Helvetica Neue", Arial, sans-serif;

  --fs-mega: clamp(3.4rem, 12.5vw, 10.5rem);
  --fs-h1: clamp(2.5rem, 7.4vw, 6rem);
  --fs-h2: clamp(2.1rem, 5.2vw, 4.4rem);
  --fs-h3: clamp(1.45rem, 2.6vw, 2.15rem);
  --fs-lead: clamp(1.06rem, 1.45vw, 1.28rem);
  --fs-body: 1rem;
  --fs-small: .875rem;
  --fs-label: .7rem;
  --track-label: .3em;

  /* Space */
  --gutter: clamp(1.25rem, 5vw, 4.5rem);
  --chrome-h: 64px;
  --ease: cubic-bezier(.22, .7, .12, 1);
  --ease-io: cubic-bezier(.65, 0, .25, 1);

  color-scheme: light;
}

/* Slide tones. Components read --bg/--fg/--muted/--accent/--rule only. */
.tone-ivory      { --bg: var(--ivory);      --fg: var(--ink);   --muted: var(--ink-soft); --accent: var(--plum);     --soft: var(--blush-soft); --rule: rgba(26, 18, 22, .16); }
.tone-ivory-deep { --bg: var(--ivory-deep); --fg: var(--ink);   --muted: var(--ink-soft); --accent: var(--plum);     --soft: var(--ivory);      --rule: rgba(26, 18, 22, .16); }
.tone-blush      { --bg: var(--blush);      --fg: var(--ink);   --muted: #4f3b43;         --accent: var(--plum);     --soft: var(--blush-soft); --rule: rgba(26, 18, 22, .18); }
.tone-blush-soft { --bg: var(--blush-soft); --fg: var(--ink);   --muted: #56434b;         --accent: var(--plum);     --soft: var(--ivory);      --rule: rgba(26, 18, 22, .16); }
.tone-plum       { --bg: var(--plum);       --fg: var(--ivory); --muted: #e3cfd6;         --accent: var(--prosecco); --soft: #5e2a4c;           --rule: rgba(247, 240, 231, .2); }
.tone-plum-deep  { --bg: var(--plum-deep);  --fg: var(--ivory); --muted: #dcc6cf;         --accent: var(--prosecco); --soft: #3c1630;           --rule: rgba(247, 240, 231, .18); }
.tone-film       { --bg: var(--ink);        --fg: var(--ivory); --muted: #e8dcd6;         --accent: var(--prosecco); --soft: #2c2026;           --rule: rgba(247, 240, 231, .22); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--plum-deep);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--fs-body);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  overscroll-behavior: none;
}
img, video, svg, canvas { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent, var(--plum)); outline-offset: 4px; border-radius: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Type primitives ---------- */
.eyebrow {
  display: flex; align-items: center; gap: .9em;
  margin: 0 0 1.4rem;
  font: 500 var(--fs-label)/1.3 var(--sans);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--accent);
}
.eyebrow::before { content: ""; width: 2.2em; height: 1px; background: currentColor; flex: none; }
.display {
  margin: 0;
  font-family: var(--serif);
  font-weight: 500;
  font-size: var(--fs-h2);
  line-height: 1.02;
  letter-spacing: -.012em;
  text-wrap: balance;
  color: var(--fg);
}
.display em, .italic { font-style: italic; font-weight: 400; }
.display em { color: var(--accent); }
.lead { font-size: var(--fs-lead); line-height: 1.6; color: var(--muted); max-width: 36em; margin: 1.4rem 0 0; }
.body { color: var(--muted); max-width: 34em; margin: 0; }
.body + .body { margin-top: 1em; }
.label {
  font: 500 var(--fs-label)/1.3 var(--sans);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--muted);
}
.flag {
  display: inline;
  padding: .05em .35em;
  border: 1px dashed currentColor;
  border-radius: 3px;
  opacity: .82;
  font-style: normal;
  box-decoration-break: clone; -webkit-box-decoration-break: clone;
}
.tabular { font-variant-numeric: lining-nums tabular-nums; }

/* ---------- Deck stage ---------- */
.deck { position: fixed; inset: 0; overflow: hidden; background: var(--plum-deep); }
.slide {
  position: absolute; inset: 0;
  overflow-x: hidden; overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
  color: var(--fg);
  visibility: hidden;
  scrollbar-width: none;
}
.slide::-webkit-scrollbar { display: none; }
.slide.is-active, .slide.is-leaving { visibility: visible; }
.slide.is-active { z-index: 2; }
.slide.is-leaving { z-index: 1; }
.slide:focus { outline: none; }
.slide__body {
  position: relative;
  min-height: 100%;
  display: flex; align-items: center;
  padding-inline: var(--gutter);
  padding-block: calc(var(--chrome-h) + env(safe-area-inset-top, 0px) + 1.25rem) calc(var(--chrome-h) + env(safe-area-inset-bottom, 0px) + 2rem);
}
.wrap { width: 100%; max-width: 1320px; margin-inline: auto; min-width: 0; }
.folio { display: none; }

/* ---------- Chrome ---------- */
.chrome {
  position: fixed; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding-inline: var(--gutter);
  color: var(--chrome-fg, var(--ink));
  transition: color .6s var(--ease);
  pointer-events: none;
}
.chrome > * { pointer-events: auto; }
body[data-tone="dark"] { --chrome-fg: var(--ivory); --chrome-dim: rgba(247, 240, 231, .5); --chrome-glass: rgba(26, 12, 22, .35); }
body[data-tone="light"] { --chrome-fg: var(--ink); --chrome-dim: rgba(26, 18, 22, .38); --chrome-glass: rgba(247, 240, 231, .6); }
.chrome--top { top: 0; height: calc(var(--chrome-h) + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); }
.chrome--bottom { bottom: 0; height: calc(var(--chrome-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }

.logo { display: inline-flex; align-items: center; gap: .6rem; text-decoration: none; min-width: 0; }
.logo img { height: 28px; width: auto; }
.logo__word { font: italic 500 1.05rem/1 var(--serif); letter-spacing: .01em; white-space: nowrap; }
.logo__slot {
  font: 500 .56rem/1 var(--sans); letter-spacing: .22em; text-transform: uppercase;
  padding: .35em .5em; border: 1px dashed currentColor; border-radius: 3px; opacity: .55; white-space: nowrap;
}
.chrome__right { display: flex; align-items: center; gap: 1.1rem; }
.counter { font: 500 .72rem/1 var(--sans); letter-spacing: .2em; color: var(--chrome-dim); white-space: nowrap; }
@media (max-width: 480px) { .counter, .logo__slot { display: none; } }
/* On phones, tall slides scroll under the chrome: give it a soft ground. */
@media (max-width: 899px) {
  .chrome--top { background: linear-gradient(180deg, var(--chrome-bg, transparent) 55%, transparent); }
  .chrome--bottom { background: linear-gradient(0deg, var(--chrome-bg, transparent) 60%, transparent); }
  body[data-tone="dark"] .chrome { background: none; }
}
.counter b { color: var(--chrome-fg); font-weight: 500; }
.menu-btn { display: inline-flex; align-items: center; gap: .6rem; font: 500 .68rem/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; padding: .7rem 0; }
.menu-btn i { display: grid; gap: 5px; width: 22px; }
.menu-btn i::before, .menu-btn i::after { content: ""; height: 1px; background: currentColor; }
.menu-btn i::after { width: 14px; justify-self: end; }

.nav-btn {
  width: 46px; height: 46px; flex: none;
  display: grid; place-items: center;
  border: 1px solid var(--chrome-dim); border-radius: 50%;
  background: var(--chrome-glass);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: border-color .3s, transform .3s var(--ease), opacity .3s;
}
.nav-btn:hover { border-color: var(--chrome-fg); transform: scale(1.05); }
.nav-btn:disabled { opacity: .25; cursor: default; transform: none; }
.nav-btn svg { width: 18px; height: 18px; }
.progress { flex: 1; display: flex; flex-direction: column; gap: .55rem; min-width: 0; max-width: 560px; }
.progress__title { font: 500 .66rem/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; text-align: center; color: var(--chrome-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress__ticks { display: flex; gap: 3px; }
.progress__ticks button { flex: 1; height: 14px; position: relative; }
.progress__ticks button::after {
  content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px;
  background: var(--chrome-dim); opacity: .55; transition: background .4s, opacity .4s;
}
.progress__ticks button.is-past::after { background: var(--chrome-fg); opacity: .55; }
.progress__ticks button.is-current::after { background: var(--chrome-fg); opacity: 1; height: 2px; }

/* ---------- Menu overlay ---------- */
.menu {
  position: fixed; inset: 0; z-index: 40;
  background: var(--plum-deep); color: var(--ivory);
  --accent: var(--prosecco); --muted: #dcc6cf; --rule: rgba(247, 240, 231, .16); --fg: var(--ivory);
  display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 1rem) var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
  overflow-y: auto;
}
.menu__top { display: flex; justify-content: space-between; align-items: center; height: var(--chrome-h); }
.menu__close { font: 500 .68rem/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; padding: .7rem 0; }
.menu__list { list-style: none; margin: auto 0; padding: 1.5rem 0; max-width: 980px; width: 100%; align-self: center; }

.chapters { list-style: none; margin: 0; padding: 0; counter-reset: ch; }
.chapters li { border-top: 1px solid var(--rule); }
.chapters li:last-child { border-bottom: 1px solid var(--rule); }
.chapters a {
  display: grid; grid-template-columns: 2.4rem 1fr auto; align-items: baseline; gap: .8rem;
  padding: .72rem 0;
  text-decoration: none;
  position: relative;
}
.chapters a::after {
  content: ""; position: absolute; left: 0; bottom: -1px; height: 1px; width: 100%;
  background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .6s var(--ease);
}
.chapters a:hover::after, .chapters a:focus-visible::after { transform: scaleX(1); }
.chapters .n { font: 500 .7rem/1 var(--sans); letter-spacing: .18em; color: var(--accent); }
.chapters .t { font: 400 clamp(1.25rem, 2.4vw, 1.9rem)/1.15 var(--serif); color: var(--fg); transition: transform .5s var(--ease); }
.chapters a:hover .t { transform: translateX(.4rem); font-style: italic; }
.chapters .p { font: 500 .7rem/1 var(--sans); letter-spacing: .18em; color: var(--muted); }

/* ---------- Intro (opening graphic) ---------- */
.intro {
  position: fixed; inset: 0; z-index: 60;
  display: grid; place-items: center;
  color: var(--ivory);
  pointer-events: auto;
}
.intro__panel { position: absolute; left: 0; right: 0; height: 50.5%; background: var(--plum-deep); }
.intro__panel--top { top: 0; }
.intro__panel--bottom { bottom: 0; }
.intro__grain {
  position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background: radial-gradient(ellipse 60% 50% at 50% 45%, rgba(220, 195, 147, .14), transparent 70%);
}
.intro__stage { position: relative; display: grid; justify-items: center; gap: 1.1rem; text-align: center; padding: 1rem; }
.intro__coords, .intro__date { font: 500 .66rem/1 var(--sans); letter-spacing: .34em; text-transform: uppercase; color: var(--prosecco); }
.intro__lake { width: clamp(150px, 30vh, 270px); height: auto; overflow: visible; }
.intro__lake .water { fill: none; stroke: rgba(233, 195, 188, .28); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
.intro__lake .shore { fill: none; stroke: var(--prosecco); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.intro__lake text { font: 500 7px var(--sans); letter-spacing: .2em; fill: var(--prosecco); text-transform: uppercase; }
.intro__lake .town { fill: var(--prosecco); }
.intro__mono { font: italic 400 clamp(3rem, 9vw, 6rem)/1 var(--serif); letter-spacing: -.01em; margin: 0; }
.intro__mono span { font-style: normal; color: var(--prosecco); font-size: .6em; vertical-align: .18em; padding-inline: .12em; }
.intro__place { font: 400 clamp(1rem, 2vw, 1.25rem)/1 var(--serif); letter-spacing: .08em; margin: 0; }
.intro__skip {
  position: absolute; right: var(--gutter); bottom: calc(env(safe-area-inset-bottom, 0px) + 1.4rem);
  font: 500 .64rem/1 var(--sans); letter-spacing: .28em; text-transform: uppercase; color: var(--ivory); opacity: .6; padding: .8rem 0;
}
.intro__skip:hover { opacity: 1; }

/* ---------- Media slots ---------- */
.m {
  position: relative;
  width: 100%; max-width: 100%;
  aspect-ratio: var(--ar, 16 / 9);
  overflow: hidden;
  background: var(--soft, var(--blush-soft));
  isolation: isolate;
}
.m > video, .m > img, .m__img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
}
.m.is-empty > video, .m.is-empty > img { display: none; }
.m__ph {
  position: absolute; inset: 0; z-index: 0;
  display: grid; place-items: center; align-content: center; gap: .55rem;
  text-align: center; padding: 1rem;
  color: var(--ph-fg, var(--plum));
  background:
    radial-gradient(120% 80% at 70% 18%, rgba(255, 244, 226, .55), transparent 55%),
    linear-gradient(160deg, var(--ph-a, var(--blush-soft)) 0%, var(--ph-b, var(--blush)) 55%, var(--ph-c, var(--prosecco)) 100%);
}
.m__ph::before {
  /* slow light across water */
  content: ""; position: absolute; inset: -20% -60%;
  background: linear-gradient(100deg, transparent 38%, rgba(255, 250, 240, .35) 50%, transparent 62%);
  animation: sheen 7s var(--ease-io) infinite;
}
.m__ph::after {
  /* crop marks */
  content: ""; position: absolute; inset: 12px;
  background:
    linear-gradient(currentColor, currentColor) top left / 14px 1px no-repeat,
    linear-gradient(currentColor, currentColor) top left / 1px 14px no-repeat,
    linear-gradient(currentColor, currentColor) top right / 14px 1px no-repeat,
    linear-gradient(currentColor, currentColor) top right / 1px 14px no-repeat,
    linear-gradient(currentColor, currentColor) bottom left / 14px 1px no-repeat,
    linear-gradient(currentColor, currentColor) bottom left / 1px 14px no-repeat,
    linear-gradient(currentColor, currentColor) bottom right / 14px 1px no-repeat,
    linear-gradient(currentColor, currentColor) bottom right / 1px 14px no-repeat;
  opacity: .45;
}
.m__ph svg { width: 34px; height: 34px; position: relative; opacity: .8; }
.m__ph .slot { position: relative; font: italic 400 clamp(.95rem, 1.6vw, 1.2rem)/1.1 var(--serif); }
.m__ph .spec { position: relative; font: 500 .58rem/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; opacity: .75; }
.tone-plum .m, .tone-plum-deep .m, .tone-film .m { --ph-a: #5c2549; --ph-b: #3d1231; --ph-c: #7a4a52; --ph-fg: var(--prosecco); }
@keyframes sheen { 0% { transform: translateX(-30%); } 60%, 100% { transform: translateX(30%); } }

.m__sound {
  position: absolute; z-index: 3; right: 12px; bottom: 12px;
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(26, 12, 22, .45); color: var(--ivory);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(247, 240, 231, .3);
  transition: transform .3s var(--ease), background .3s;
}
.m__sound:hover { transform: scale(1.08); background: rgba(26, 12, 22, .7); }
.m__sound svg { width: 16px; height: 16px; }
.m.is-empty .m__sound { display: none; }

/* Vertical 9:16 inside a phone frame */
.phone {
  position: relative;
  width: 100%;
  padding: 9px;
  border-radius: 40px;
  background: linear-gradient(145deg, #2d2228, #0f0a0d 60%, #2a1f25);
  box-shadow:
    0 0 0 1px rgba(220, 195, 147, .35),
    0 30px 60px -20px rgba(42, 12, 31, .45),
    0 12px 24px -12px rgba(42, 12, 31, .35);
}
.phone .m { border-radius: 32px; --ar: 9 / 16; }
.phone::before {
  content: ""; position: absolute; z-index: 4; top: 17px; left: 50%; translate: -50% 0;
  width: 30%; height: 20px; border-radius: 12px; background: #0c0709;
}

/* ---------- Shared slide layouts ---------- */
.split { display: grid; gap: clamp(2rem, 5vw, 5rem); align-items: center; }
@media (min-width: 900px) {
  .split { grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); }
  .split--reverse > :first-child { order: 2; }
  .split--phone { grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); }
}
.phone-col { width: min(100%, 300px); justify-self: center; }
@media (min-width: 900px) { .phone-col { width: min(100%, 290px, 33vh); } }

/* ---------- Cover ---------- */
.s-cover .slide__body { align-items: flex-end; padding-bottom: calc(var(--chrome-h) + env(safe-area-inset-bottom, 0px) + 2.5rem); }
.cover__bg { position: absolute; inset: 0; overflow: hidden; background: var(--plum-deep); }
.cover__bg canvas, .cover__bg video, .cover__bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover__bg .kb { animation: kenburns 26s ease-in-out infinite alternate; transform-origin: 60% 55%; }
@keyframes kenburns { from { transform: scale(1.02) translate(0, 0); } to { transform: scale(1.12) translate(-1.5%, -1%); } }
.cover__scrim {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(42, 12, 31, .55) 0%, rgba(42, 12, 31, 0) 28%),
    linear-gradient(0deg, rgba(26, 8, 20, .88) 0%, rgba(26, 8, 20, .35) 45%, rgba(26, 8, 20, 0) 70%);
}
.cover__content { position: relative; z-index: 2; }
@media (min-width: 900px) { .s-cover .cover__content { padding-right: calc(min(270px, 36vh) + 9vw); } }
.cover__h {
  margin: 0;
  font-family: var(--serif);
  color: var(--ivory);
  line-height: .95;
  letter-spacing: -.02em;
}
.cover__h .line { display: block; }
.cover__h .roman { font-size: var(--fs-mega); font-weight: 600; }
.cover__h .italic { font-size: var(--fs-mega); font-style: italic; font-weight: 400; color: var(--blush); }
.cover__h .small { font-size: clamp(1.35rem, 3.6vw, 2.7rem); font-weight: 400; font-style: italic; margin-top: .9rem; letter-spacing: -.005em; line-height: 1.15; max-width: 30ch; }
.cover__h .w { display: inline-block; will-change: filter, opacity, transform; }
.cover__sub { margin: 1.6rem 0 0; font: 500 .7rem/1.7 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--prosecco); max-width: 40em; }
.cover__begin { text-decoration: none; }
.cover__begin {
  margin-top: 2rem;
  display: inline-flex; align-items: center; gap: 1rem;
  font: 500 .7rem/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--ivory);
  padding: .6rem 0;
}
.cover__begin .line { width: 64px; height: 1px; background: rgba(247, 240, 231, .35); position: relative; overflow: hidden; }
.cover__begin .line::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--prosecco); animation: cue 2.4s var(--ease-io) infinite; }
@keyframes cue { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
.cover__reel { position: absolute; z-index: 2; right: var(--gutter); top: calc(var(--chrome-h) + env(safe-area-inset-top, 0px) + 1rem); }
.cover__phone { display: none; }
.stamp { position: relative; width: clamp(92px, 12vw, 140px); color: var(--prosecco); }
/* The couple's reel: a phone beside the headline, sealed with the stamp */
.cover__reel:not(.no-reel) { top: 50%; translate: 0 -54%; right: clamp(1.25rem, 8vw, 9rem); }
.cover__reel:not(.no-reel) .cover__phone { display: block; width: min(270px, 36vh); }
.cover__reel:not(.no-reel) .stamp { position: absolute; left: -58px; top: -46px; width: clamp(96px, 9vw, 124px); }
.cover__phone .phone { box-shadow: 0 0 0 1px rgba(220, 195, 147, .45), 0 40px 80px -30px rgba(0, 0, 0, .7); }
@media (max-width: 899px) {
  .cover__reel:not(.no-reel) { top: calc(var(--chrome-h) + env(safe-area-inset-top, 0px) + .6rem); translate: none; right: var(--gutter); }
  .cover__reel:not(.no-reel) .cover__phone { width: min(34vw, 150px, 24vh); }
  .cover__reel:not(.no-reel) .cover__phone .phone { padding: 5px; border-radius: 22px; }
  .cover__reel:not(.no-reel) .cover__phone .m { border-radius: 18px; }
  .cover__reel:not(.no-reel) .cover__phone .phone::before { top: 9px; height: 11px; }
  .cover__reel:not(.no-reel) .stamp { display: none; }
}
/* Placeholder that links out while the file isn't in /media yet */
.m__link {
  position: absolute; inset: 0; z-index: 2;
  display: grid; place-content: center; justify-items: center; gap: .45rem; text-align: center;
  color: var(--ivory); text-decoration: none;
  background: linear-gradient(180deg, rgba(42, 12, 31, .15), rgba(42, 12, 31, .55));
}
.m__link svg { width: 40px; height: 40px; transition: transform .5s var(--ease); }
.m__link span { font: italic 400 1.15rem/1.1 var(--serif); }
.m__link small { font: 500 .56rem/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--prosecco); }
.m__link:hover svg { transform: scale(1.08); }
.m.has-link .m__ph .slot, .m.has-link .m__ph .spec, .m.has-link .m__ph svg { display: none; }
.stamp svg { width: 100%; height: auto; animation: spin 40s linear infinite; }
.stamp text { font: 500 8.6px var(--sans); letter-spacing: 2.6px; text-transform: uppercase; fill: currentColor; }
.stamp .core { position: absolute; inset: 0; display: grid; place-items: center; font: italic 400 clamp(.95rem, 1.6vw, 1.3rem)/1 var(--serif); color: var(--ivory); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Quote (Your story slide) ---------- */
.quote { position: relative; max-width: 1100px; }
.quote blockquote { margin: 0; }
.quote blockquote p { margin: 0; font: italic 400 clamp(2.5rem, 7.6vw, 6.4rem)/1.02 var(--serif); letter-spacing: -.015em; text-wrap: balance; color: var(--ivory); }
.quote blockquote .w { display: inline-block; }
.quote blockquote .hl { color: var(--blush); }
.quote footer { margin-top: 2rem; font: 500 .72rem/1.6 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--prosecco); }

/* ---------- What we'll capture ---------- */
.vision__head { display: grid; gap: 1rem; margin-bottom: clamp(1.6rem, 4vh, 2.8rem); }
@media (min-width: 900px) { .vision__head { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: end; gap: 5rem; } .vision__head .lead { margin: 0; } }
.pillars { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.6rem 1rem; }
@media (min-width: 700px) { .pillars { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1100px) {
  .pillars { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1.1rem; }
  .pillars li:nth-child(even) { margin-top: 2.6rem; }
}
.pillars a { display: block; text-decoration: none; }
.pillars .m { aspect-ratio: 4 / 5; }
.pillars .m, .pillars .phone { transition: transform .8s var(--ease); }
.pillars a:hover .m { transform: scale(.98); }
.pillars .n { display: block; margin-top: .9rem; font: 500 .62rem/1 var(--sans); letter-spacing: .2em; color: var(--accent); }
.pillars .t { display: block; margin-top: .45rem; font: 500 clamp(1rem, 1.35vw, 1.12rem)/1.2 var(--serif); color: var(--fg); }
.pillars .l { display: block; margin-top: .35rem; font-size: .8rem; line-height: 1.45; color: var(--muted); }

/* ---------- Vendors map ---------- */
.vendors { display: grid; gap: 2rem; align-items: center; }
@media (min-width: 1000px) { .vendors { grid-template-columns: minmax(0, .72fr) minmax(0, 1.28fr); gap: 3.5rem; } }
.vendors .display { font-size: clamp(2rem, 4.4vw, 3.7rem); }
.vendors .body { margin-top: 1.2rem; }
.vlist { list-style: none; margin: 1.8rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem 1.2rem; }
.vlist li { min-width: 0; display: grid; grid-template-columns: 10px 1fr; gap: .2rem .7rem; align-items: baseline; }
.vlist i { width: 7px; height: 7px; border-radius: 50%; background: var(--prosecco); translate: 0 -1px; }
.vlist li.unpinned i { background: transparent; border: 1px dashed var(--prosecco); }
.vlist b { font: 500 .98rem/1.2 var(--serif); color: var(--fg); min-width: 0; overflow-wrap: anywhere; }
.vlist span { grid-column: 2; font-size: .74rem; line-height: 1.4; color: var(--muted); }
.map { position: relative; min-width: 0; }
.map svg { width: 100%; height: auto; overflow: visible; }
.map .dots { stroke: rgba(247, 240, 231, .22); stroke-linecap: round; fill: none; }
.map .arc { fill: none; stroke: var(--prosecco); stroke-width: 1.4; stroke-linecap: round; }
.map .arc.route { stroke: var(--blush); stroke-dasharray: 2 7; }
.map .pin circle.dot { fill: var(--prosecco); }
.map .pin.route circle.dot { fill: var(--blush); }
.map .pin circle.ring { fill: none; stroke: var(--prosecco); transform-box: fill-box; transform-origin: center; animation: pulse 2.6s var(--ease) infinite; }
.map .pin.home circle.dot { fill: var(--ivory); }
.map .pin.home circle.ring { stroke: var(--ivory); }
.map .pin text { fill: var(--ivory); font-family: var(--sans); font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
.map .pin.home text { font-family: var(--serif); font-style: italic; letter-spacing: 0; text-transform: none; }
.map__note { margin-top: .8rem; text-align: right; }
@keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }

/* ---------- Meet Kea ---------- */
.team { display: grid; gap: 2.4rem; align-items: center; }
@media (min-width: 900px) { .team { grid-template-columns: minmax(0, .7fr) minmax(0, 1.3fr); gap: 5rem; } }
.team__name { margin: 0; font: italic 400 clamp(5rem, 16vw, 11rem)/.85 var(--serif); letter-spacing: -.03em; color: var(--fg); }
.team__role { margin-top: 1.4rem; }
.team .body { margin-top: 1.2rem; font-size: var(--fs-lead); }
.ig { display: inline-flex; align-items: center; gap: .55rem; margin-top: 1.6rem; font: 500 .72rem/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); text-decoration: none; padding: .5rem 0; border-bottom: 1px solid currentColor; }
.ig svg { width: 15px; height: 15px; }
.team__next { margin-top: 2.4rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); font-size: var(--fs-small); color: var(--muted); max-width: 30em; }
.team__next a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.team__name { font-size: clamp(4rem, 11vw, 8rem); line-height: 1; padding-bottom: .2em; }
.team__name + .team__role { margin-top: .4rem; }
@media (max-width: 899px) { .team > .phone-col { order: 2; width: min(70%, 260px); } }
.team__tag { margin: .9rem 0 0; font: italic 400 clamp(1.2rem, 1.8vw, 1.5rem)/1.3 var(--serif); color: var(--accent); }
.team .body { font-size: 1.02rem; max-width: 36em; }

/* Credentials row, shared by Kea and Stephen */
.creds { list-style: none; margin: 1.6rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; max-width: 620px; }
.creds li { min-width: 0; padding-top: .8rem; border-top: 1px solid var(--rule); }
.creds b { display: block; font: 500 clamp(1.1rem, 1.9vw, 1.65rem)/1.1 var(--serif); color: var(--accent); }
.creds .label { display: block; margin-top: .45rem; font-size: .58rem; line-height: 1.45; letter-spacing: .18em; }

/* Meet Stephen */
.team--second .mate__tag { margin: 0 0 1rem; background: var(--prosecco); color: var(--plum-deep); }
.partners { margin: 1.4rem 0 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: .35rem .7rem; }
.partners .label { width: 100%; margin-bottom: .2rem; }
.partners b { font: 500 clamp(1.05rem, 1.7vw, 1.35rem)/1.2 var(--serif); color: var(--fg); letter-spacing: .02em; }
.partners i { font-style: normal; color: var(--accent); }
.second__also { margin: .9rem 0 0; font-size: .86rem; color: var(--muted); max-width: 34em; }
.second__side { display: grid; gap: 2rem; align-items: center; }
.second__side .phone-col { width: min(100%, 240px); }
.two ol { list-style: none; margin: .9rem 0 0; padding: 0; display: grid; gap: 1.1rem; }
.two li { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: .8rem; align-items: start; padding-top: .9rem; border-top: 1px solid var(--rule); }
.two__n { font: italic 400 1.6rem/1 var(--serif); color: var(--accent); }
.two b { display: block; font: 500 1.05rem/1.25 var(--serif); color: var(--fg); }
.two p { margin: .3rem 0 0; font-size: .84rem; line-height: 1.5; color: var(--muted); }
@media (min-width: 900px) {
  .team--second { grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 4rem; }
  .second__side { grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 2.2rem; }
  .second__side .phone-col { width: min(200px, 30vh); }
}

/* Wordmark lockup until the logo file is added */
.wordmark { display: inline-grid; justify-items: center; line-height: 1; font-family: var(--serif); }
.wordmark b { font-weight: 500; font-style: normal; font-size: 1.05rem; letter-spacing: .16em; text-transform: uppercase; }
.wordmark small { margin-top: .22rem; font-family: var(--sans); font-size: .42rem; letter-spacing: .42em; text-transform: uppercase; opacity: .85; }

/* ---------- Coverage options ---------- */
.opts { display: grid; gap: 2.4rem; }
@media (min-width: 1000px) { .opts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 5rem; align-items: center; } }
.opts .hours { margin-top: 2.4rem; padding-top: 1.6rem; border-top: 1px solid var(--rule); }
.toggle {
  display: inline-grid; grid-template-columns: 1fr 1fr; position: relative;
  border: 1px solid var(--rule); border-radius: 999px; padding: 4px; margin: 1.6rem 0 2rem;
  background: rgba(255, 255, 255, .35);
}
.toggle button {
  position: relative; z-index: 1;
  padding: .85rem 1.4rem;
  font: 500 .68rem/1 var(--sans); letter-spacing: .24em; text-transform: uppercase;
  color: var(--muted); transition: color .5s var(--ease);
  white-space: nowrap;
}
.toggle button[aria-pressed="true"] { color: var(--ivory); }
.toggle__pill { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px; background: var(--plum); transition: transform .6s var(--ease); }
.toggle[data-sel="two"] .toggle__pill { transform: translateX(100%); }
.panels { display: grid; }
.panel { grid-area: 1 / 1; transition: opacity .7s var(--ease), transform .7s var(--ease), filter .7s var(--ease); }
.panel[aria-hidden="true"] { opacity: 0; transform: translateY(10px); filter: blur(4px); pointer-events: none; }
.panel__title { margin: 0; font: 500 var(--fs-h3)/1.15 var(--serif); }
.panel .mate { margin-top: 1.2rem; }
.panel__line { margin: .8rem 0 0; color: var(--muted); max-width: 32em; }
.price { margin-top: 1.8rem; }
.price__num {
  display: flex; align-items: flex-start;
  font: 500 clamp(3.6rem, 10vw, 7.6rem)/1 var(--serif); letter-spacing: -.03em; color: var(--plum);
  font-variant-numeric: lining-nums tabular-nums;
}
.price__num [data-price] { display: flex; align-items: flex-start; }
.price__num .cur { font-size: .42em; line-height: 1; margin-top: .12em; margin-right: .1em; font-weight: 400; align-self: flex-start; }
.roll { display: inline-block; height: 1em; overflow: hidden; line-height: 1; }
.roll > span { display: flex; flex-direction: column; transition: transform .75s var(--ease); }
.roll > span > span { height: 1em; line-height: 1; }
.price .label { display: block; margin-top: .8rem; }
.panel__tab, .sched__name { display: none; }
.opts__note { margin-top: 1.6rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); color: var(--fg); font: italic 400 1.1rem/1.45 var(--serif); max-width: 30em; }
.mate { margin-top: 1.8rem; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 1.2rem; align-items: center; padding: 1rem; border: 1px solid var(--rule); border-radius: 18px; background: rgba(255, 255, 255, .3); max-width: 560px; }
.mate .phone { padding: 5px; border-radius: 20px; }
.mate .phone .m { border-radius: 16px; }
.mate .phone::before { display: none; }
.mate .m__ph svg, .mate .m__ph .spec { display: none; }
.mate .m__ph .slot { font-size: .7rem; }
.mate .m__sound { width: 28px; height: 28px; right: 6px; bottom: 6px; }
.mate__name { font: italic 400 1.9rem/1 var(--serif); margin: 0; }
.mate__tag { display: inline-block; margin-bottom: .5rem; font: 500 .58rem/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; padding: .4rem .6rem; border-radius: 999px; background: var(--plum); color: var(--ivory); }
.mate p { margin: .45rem 0 0; font-size: .84rem; color: var(--muted); line-height: 1.5; }
.mate .ig { margin-top: .6rem; font-size: .62rem; }
.hours h3 { margin: 0; font: 500 var(--fs-h3)/1.15 var(--serif); }
.hours .label { display: block; margin-top: .5rem; }
.hours ul { list-style: none; margin: 1.6rem 0 0; padding: 0; display: grid; gap: 1.2rem; }
.hours li { display: grid; grid-template-columns: 1fr auto; gap: .45rem 1rem; }
.hours .ev { font: 500 1.02rem/1.2 var(--serif); }
.hours .hr { font: 500 .7rem/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.hours .bar { grid-column: 1 / -1; height: 3px; background: var(--rule); position: relative; overflow: hidden; border-radius: 3px; }
.hours .bar i { position: absolute; inset: 0; width: var(--w); background: linear-gradient(90deg, var(--prosecco), var(--plum)); transform-origin: left; border-radius: 3px; }
.hours .scale { display: flex; justify-content: space-between; margin-top: .6rem; font: 500 .58rem/1 var(--sans); letter-spacing: .14em; color: var(--muted); }

/* ---------- Turnaround and deliverables (Why slide) ---------- */
.deliv { display: grid; gap: 2.4rem; }
@media (min-width: 900px) { .deliv { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 5rem; align-items: center; } }
.stats { display: grid; gap: 1.8rem; margin-top: 2.2rem; }
@media (min-width: 560px) { .stats { grid-template-columns: 1fr 1fr; } }
.stat__v { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
.stat__v b { font: 400 clamp(3.4rem, 8vw, 5.6rem)/.95 var(--serif); color: var(--prosecco); letter-spacing: -.03em; }
.stat__v span { font: italic 400 1.1rem/1.2 var(--serif); color: var(--ivory); }
.stat .label { display: block; margin-top: .7rem; color: var(--prosecco); }
.stat p { margin: .5rem 0 0; font-size: .86rem; color: var(--muted); max-width: 22em; line-height: 1.5; }
.dlist h3 { margin: 0 0 1rem; font: italic 400 var(--fs-h3)/1.15 var(--serif); }
.dlist ul { list-style: none; margin: 0; padding: 0; }
.dlist li { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 1rem; padding: 1rem 0; border-top: 1px solid var(--rule); align-items: baseline; }
.dlist li:last-child { border-bottom: 1px solid var(--rule); }
.dlist b { font: 500 1.02rem/1.3 var(--serif); }
.dlist span { font-size: .82rem; color: var(--muted); }

/* ---------- Accordions (Logistics slide) ---------- */
.terms { display: grid; gap: 2rem; }
@media (min-width: 900px) { .terms { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 5rem; align-items: center; } }
.acc { border-top: 1px solid var(--rule); }
.acc:last-child { border-bottom: 1px solid var(--rule); }
.acc h3 { margin: 0; }
.acc button {
  width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  padding: 1.15rem 0; text-align: left;
  font: 400 clamp(1.15rem, 2vw, 1.5rem)/1.2 var(--serif); color: var(--fg);
}
.acc button:hover { font-style: italic; }
.acc .pm { position: relative; width: 14px; height: 14px; flex: none; }
.acc .pm::before, .acc .pm::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--accent); transition: transform .5s var(--ease); }
.acc .pm::after { transform: rotate(90deg); }
.acc button[aria-expanded="true"] .pm::after { transform: rotate(0deg); }
.acc__panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .6s var(--ease); }
.acc__panel > div { overflow: hidden; }
.acc__panel p { margin: 0; padding: 0 2.4rem 1.3rem 0; color: var(--muted); max-width: 36em; }
.acc button[aria-expanded="true"] + .acc__panel { grid-template-rows: 1fr; }

/* ---------- Reserve ---------- */
.reserve { display: grid; gap: 2.4rem; }
@media (min-width: 900px) { .reserve { grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 5rem; align-items: center; } }
.reserve .toggle { margin-bottom: 0; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; position: relative; }
.steps::before { content: ""; position: absolute; left: 22px; right: calc(50% - 22px); top: 22px; height: 1px; background: var(--rule); }
.steps .link { position: absolute; left: 22px; top: 22px; height: 1px; width: calc(50% - 22px + .5rem); background: var(--plum); transform-origin: left; }
.steps li { position: relative; min-width: 0; }
.steps .dot { width: 45px; height: 45px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--plum); font: italic 400 1.2rem/1 var(--serif); color: var(--plum); position: relative; }
.steps li:first-child .dot { background: var(--plum); color: var(--ivory); }
.steps .when { display: block; margin-top: 1.2rem; }
.steps .amt { display: block; margin-top: .5rem; font: 500 clamp(2.2rem, 5vw, 3.6rem)/1 var(--serif); letter-spacing: -.02em; color: var(--fg); font-variant-numeric: lining-nums tabular-nums; }
.steps .what { display: block; margin-top: .5rem; font-size: .84rem; color: var(--muted); line-height: 1.45; }
.sched { display: grid; }
.sched > div { grid-area: 1 / 1; transition: opacity .6s var(--ease), filter .6s var(--ease); }
.sched > div[aria-hidden="true"] { opacity: 0; filter: blur(4px); pointer-events: none; }
.total { margin-top: 1.8rem; padding-top: 1rem; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.total b { font: 500 1.4rem/1 var(--serif); color: var(--plum); font-variant-numeric: lining-nums tabular-nums; }
.reserve__note { margin-top: 1.4rem; font-size: .86rem; color: var(--muted); max-width: 34em; line-height: 1.55; }
.cta {
  display: inline-flex; align-items: center; gap: 1rem;
  margin-top: 2rem; padding: 1.15rem 1.7rem 1.15rem 1.9rem;
  background: var(--plum); color: var(--ivory);
  border-radius: 999px; text-decoration: none;
  font: 500 .74rem/1.2 var(--sans); letter-spacing: .22em; text-transform: uppercase;
  position: relative; overflow: hidden;
  transition: transform .5s var(--ease), box-shadow .5s var(--ease);
  box-shadow: 0 14px 30px -14px rgba(79, 26, 62, .6);
}
.cta::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(220, 195, 147, .35) 50%, transparent 70%); transform: translateX(-100%); transition: transform 1s var(--ease); }
.cta:hover { transform: translateY(-2px); box-shadow: 0 20px 36px -14px rgba(79, 26, 62, .7); }
.cta:hover::before { transform: translateX(100%); }
.cta svg { width: 16px; height: 16px; position: relative; }
.cta span { position: relative; }
.cta.is-placeholder { outline: 1px dashed var(--plum); outline-offset: 5px; }
.cta__flag { display: block; margin-top: .9rem; font-size: .72rem; color: var(--muted); }

/* ---------- Type switcher (review only; content.js typePicker) ---------- */
.type-btn {
  display: inline-flex; align-items: center; gap: .5rem;
  font: 500 .64rem/1 var(--sans); letter-spacing: .2em; text-transform: uppercase;
  padding: .55rem .8rem; border: 1px dashed var(--chrome-dim); border-radius: 999px;
}
.type-btn:hover { border-style: solid; }

/* ---------- Your story ---------- */
.us .quote blockquote p { font-size: clamp(2.3rem, 6.2vw, 5.4rem); }
.us .quote footer { margin-top: 1.4rem; }
.beats { list-style: none; margin: clamp(2rem, 6vh, 3.6rem) 0 0; padding: 0; display: grid; gap: 1.6rem; }
@media (min-width: 760px) { .beats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2.4rem; } }
.beats li { border-top: 1px solid var(--rule); padding-top: 1.1rem; min-width: 0; }
.beats b { display: block; font: 400 clamp(2.2rem, 4.4vw, 3.6rem)/1 var(--serif); color: var(--prosecco); letter-spacing: -.01em; }
.beats .label { display: block; margin-top: .7rem; color: var(--prosecco); }
.beats p { margin: .5rem 0 0; color: var(--muted); font-size: .92rem; max-width: 26em; }

/* ---------- The weekend ---------- */
.where { display: inline-flex; align-items: center; gap: .6rem; margin-top: 1.6rem; font: 500 .7rem/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--accent); }
.where svg { width: 14px; height: 14px; }

.days__head { display: grid; gap: .4rem; margin-bottom: clamp(1.6rem, 4vh, 2.6rem); }
@media (min-width: 900px) { .days__head { grid-template-columns: minmax(0, 1fr) auto; align-items: end; column-gap: 3rem; } .days__head .eyebrow { grid-column: 1 / -1; } .days__head .where { margin: 0 0 .4rem; } }
.days__list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.8rem; }
.dayc { display: grid; grid-template-columns: minmax(0, 38%) minmax(0, 1fr); gap: 1.2rem; align-items: center; }
.dayc__it { margin: .5rem 0 0; font: italic 400 clamp(1.5rem, 2.4vw, 2.1rem)/1.05 var(--serif); color: var(--fg); }
.dayc__title { margin: .45rem 0 0; font: 500 1.05rem/1.25 var(--serif); color: var(--fg); }
.dayc__line { margin: .5rem 0 0; font-size: .86rem; color: var(--muted); line-height: 1.5; }
.dayc .phone { padding: 6px; border-radius: 26px; }
.dayc .phone .m { border-radius: 21px; }
.dayc .phone::before { top: 11px; height: 13px; }
@media (min-width: 900px) {
  .days__list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2.4rem; }
  .dayc { grid-template-columns: minmax(0, 180px) minmax(0, 1fr); align-items: end; gap: 1.4rem; }
  .dayc__phone { width: min(180px, 26vh); }
}

/* ---------- Why Curated by Kea ---------- */
.why { display: grid; gap: 2.4rem; }
@media (min-width: 900px) { .why { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 4.5rem; align-items: center; } }
.why .display { font-size: clamp(1.9rem, 4vw, 3.4rem); }
.why .stat__v b { color: var(--plum); }
.why .stat__v span { color: var(--fg); }
.why .stat .label { color: var(--plum); }

/* ---------- Logistics ---------- */
.col__icon { display: block; width: 30px; height: 30px; color: var(--accent); }
.col__icon svg { width: 30px; height: 30px; }

.logistics { display: grid; gap: 1.8rem; }
@media (min-width: 1000px) {
  .logistics { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); column-gap: 4.5rem; row-gap: 1.4rem; align-items: start; }
  .logistics__head { grid-column: 1 / -1; }
}
.logistics__needs { display: grid; gap: 1.2rem; }
.need { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 1rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
.need h3 { margin: 0; font: 500 1.3rem/1.1 var(--serif); }
.need__lead { margin: .4rem 0 0; font-size: .92rem; color: var(--fg); }
.need ul { list-style: none; margin: .5rem 0 0; padding: 0; display: grid; gap: .25rem; }
.need li { position: relative; padding-left: 1rem; font-size: .8rem; line-height: 1.45; color: var(--muted); }
.need li::before { content: ""; position: absolute; left: 0; top: .6em; width: 4px; height: 4px; border-radius: 50%; background: var(--prosecco-deep); }
.logistics__terms .label { display: block; margin-bottom: .6rem; color: var(--accent); }
.logistics__terms .acc button { padding-block: .85rem; font-size: clamp(1.02rem, 1.6vw, 1.25rem); }

/* ---------- Reserve sign-off ---------- */
.signoff { margin-top: 2.4rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; align-items: center; gap: .8rem 1.6rem; }
.signoff__line { font: italic 400 1.5rem/1 var(--serif); color: var(--plum); }
.signoff .logo__word { font-size: 1.15rem; }
.signoff .ig { margin: 0; }

/* ---------- Short screens: tighten so desktop slides fit without scroll ---------- */
@media (min-width: 900px) and (max-height: 820px) {
  :root { --fs-h2: clamp(2rem, 4.4vw, 3.8rem); }
  .needs .col li { padding-block: .38rem; }
}

/* ---------- Reduced motion: static, complete, no autoplay ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  .m__ph::before { display: none; }
}
@media (max-width: 480px) { .type-btn span { display: none; } .type-btn { padding: .5rem .65rem; } }

/* ---------- Couture: heavy fashion Didone, masthead energy ---------- */
html[data-type="couture"] {
  --serif: "SJT Couture", "Bodoni 72", Didot, Georgia, serif;
  --fs-mega: clamp(3.1rem, 11.4vw, 9.8rem);
  --fs-h2: clamp(2rem, 4.9vw, 4.1rem);
}
html[data-type="couture"] .display,
html[data-type="couture"] .cover__h .roman { letter-spacing: -.005em; line-height: 1.04; }
html[data-type="couture"] .cover__h .italic,
html[data-type="couture"] .quote blockquote p,
html[data-type="couture"] .closing__line { font-weight: 500; }

/* ---------- Villa: Roman inscription capitals, Lake Como stone ---------- */
html[data-type="villa"] {
  --serif: "SJT Villa", "Trajan Pro", "Cinzel", Georgia, serif;
  --sans: "SJT Villa Text", "Optima", "Candara", "Helvetica Neue", Arial, sans-serif;
  --fs-mega: clamp(2.7rem, 9.6vw, 8.2rem);
  --fs-h2: clamp(1.8rem, 4.2vw, 3.5rem);
  --fs-h3: clamp(1.25rem, 2.2vw, 1.8rem);
}
html[data-type="villa"] .display,
html[data-type="villa"] .cover__h .roman,
html[data-type="villa"] .day__title, html[data-type="villa"] .panel__title,
html[data-type="villa"] .hours h3, html[data-type="villa"] .col h3, html[data-type="villa"] .need h3,
html[data-type="villa"] .dayc__title { font-weight: 600; letter-spacing: .03em; line-height: 1.12; }
html[data-type="villa"] .cover__h .roman { letter-spacing: .02em; }
/* Cormorant's italic runs small: give the accent lines more size */
html[data-type="villa"] .cover__h .italic,
html[data-type="villa"] .quote blockquote p,
html[data-type="villa"] .closing__line,
html[data-type="villa"] .day__it,
html[data-type="villa"] .dayc__it,
html[data-type="villa"] .team__name { font-size-adjust: .5; }
html[data-type="villa"] body { font-size: .97rem; }

/* ---------- Modern: architectural grotesque, editorial italic accents ---------- */
html[data-type="modern"] {
  --serif: "SJT Modern", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --sans: "SJT Modern Text", "Helvetica Neue", Arial, sans-serif;
  --fs-mega: clamp(2.9rem, 10.4vw, 9rem);
  --fs-h2: clamp(1.9rem, 4.4vw, 3.7rem);
}
html[data-type="modern"] .display,
html[data-type="modern"] .cover__h .roman,
html[data-type="modern"] .day__title, html[data-type="modern"] .panel__title,
html[data-type="modern"] .hours h3, html[data-type="modern"] .col h3, html[data-type="modern"] .need h3,
html[data-type="modern"] .dayc__title, html[data-type="modern"] .price__num,
html[data-type="modern"] .steps .amt, html[data-type="modern"] .beats b, html[data-type="modern"] .stat__v b { font-weight: 700; letter-spacing: -.035em; line-height: 1; }
html[data-type="modern"] .cover__h .italic,
html[data-type="modern"] .quote blockquote p,
html[data-type="modern"] .closing__line,
html[data-type="modern"] .day__it,

html[data-type="villa"] .vendors .display { font-size: clamp(1.8rem, 3.5vw, 2.9rem); }

/* Print / PDF: one slide per 16:9 page, every state shown at once.
   Both coverage options, every accordion open, all pins lit, no motion. */
@page { size: 1600px 900px; margin: 0; }

html, body { height: auto !important; overflow: visible !important; background: var(--ivory) !important; }
* { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; animation: none !important; transition: none !important; }

.intro, .chrome, .menu, #live, .m__sound, .intro__skip { display: none !important; }

.deck { position: static !important; overflow: visible !important; }
.slide {
  position: relative !important; inset: auto !important;
  visibility: visible !important;
  width: 1600px; height: 900px;
  overflow: hidden !important;
  clip-path: none !important; opacity: 1 !important; transform: none !important;
  break-after: page; page-break-after: always;
}
.slide:last-child { break-after: auto; page-break-after: auto; }
.slide [data-a], .slide .m, .slide .w { opacity: 1 !important; filter: none !important; transform: none !important; clip-path: none !important; }
.slide__body { min-height: 900px; height: 900px; padding-block: 64px 80px; }

/* Folio with a clickable way back to the contents page */
.folio {
  display: flex !important; justify-content: space-between; gap: 2rem;
  position: absolute; left: var(--gutter); right: var(--gutter); bottom: 26px; z-index: 5;
  font: 500 .62rem/1 var(--sans); letter-spacing: .26em; text-transform: uppercase;
  color: var(--muted); border-top: 1px solid var(--rule); padding-top: 12px;
}
.folio a { color: var(--accent); text-decoration: none; }
.folio__nav { display: flex; gap: 1.6rem; align-items: center; }
.folio__nav a { padding: 4px 0; border-bottom: 1px solid currentColor; }
.cover__begin { text-decoration: none; }
.s-cover .folio, .s-closing .folio { border-color: transparent; }

/* Coverage options side by side, both prices */
.s-options .toggle, .s-reserve .toggle, .s-options .price { display: none !important; }
.s-options .panels { grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 1.6rem; }
.s-options .panel { grid-area: auto !important; opacity: 1 !important; filter: none !important; transform: none !important; }
.s-options .panel__price { font: 500 2.6rem/1 var(--serif); color: var(--plum); letter-spacing: -.02em; display: block; margin-top: .6rem; text-transform: none; }
.s-options .panel__title { margin-top: .8rem !important; font-size: 1.4rem; }
.s-options .panel__line { font-size: .86rem; }
.s-options .mate { grid-template-columns: 64px 1fr; padding: .7rem; gap: .9rem; }
.s-options .mate p { font-size: .76rem; }
.s-options .display { font-size: 3.2rem; }

.s-reserve .sched { grid-template-columns: 1fr 1fr; gap: 2.4rem; }
.s-reserve .sched > div { grid-area: auto !important; opacity: 1 !important; filter: none !important; }
.s-reserve .steps .amt { font-size: 2.2rem; }
.sched__name { color: var(--plum) !important; margin-bottom: 1rem; }

.acc__panel { grid-template-rows: 1fr !important; }
.acc .pm { display: none; }
.acc button { padding-block: .7rem .2rem; }
.acc__panel p { padding-bottom: .8rem; font-size: .9rem; }

.map .pin circle.ring { display: none; }
.stamp svg { animation: none !important; }
.m__ph::before { display: none; }
.panel__tab, .sched__name { display: block !important; }

  const ICON = {
    prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
    next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    play: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><circle cx="20" cy="20" r="19"/><path d="M16 13.5v13l10-6.5z" fill="currentColor" stroke="none"/></svg>',
    image: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="4" y="8" width="32" height="24" rx="1"/><path d="M4 27l9-8 7 6 5-4 11 8"/><circle cx="27" cy="15" r="2.5"/></svg>',
    muted: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
    sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>',
    ig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".9" fill="currentColor"/></svg>',
    stay: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><path d="M4 24V9M4 18h24v6M28 18v-3a4 4 0 0 0-4-4H14v7"/><circle cx="9" cy="14" r="2.5"/></svg>',
    car: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><path d="M5 20v-4l3-6h16l3 6v4z"/><path d="M5 20v3h3v-3M24 20v3h3v-3M5 16h22"/><circle cx="10" cy="18" r=".8" fill="currentColor"/><circle cx="22" cy="18" r=".8" fill="currentColor"/></svg>',
    meal: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><path d="M10 4h8l-.6 6a3.4 3.4 0 0 1-6.8 0z"/><path d="M14 13.5V26M10 26h8"/><path d="M22 4v22M22 4c2.5 1.5 3 5 3 8h-3"/></svg>',
  };

  /* ------------------------------------------------------------ media slot */
  // One component for every slot: 16:9 or 9:16 (phone frame), video or image,
  // poster, lazy src, muted autoplay while its slide is on screen, tap to unmute.
  // An empty slot renders a styled placeholder with its name and ratio.
  function media(slot, { phone = false, mask = true } = {}) {
    const m = M[slot] || { kind: "image", aspect: "16:9", src: "", alt: slot };
    const [a, b] = (m.aspect || "16:9").split(":");
    const empty = !m.src;
    const alt = esc(m.alt || slot);
    let inner = `<div class="m__ph" aria-hidden="true">${m.kind === "video" ? ICON.play : ICON.image}<span class="slot">${esc(slot)}</span><span class="spec">${esc(m.aspect)} · ${m.kind === "video" ? "video" : "image"}</span></div>`;
    if (!empty && m.kind === "video") {
      inner += `<video muted loop playsinline preload="none"${m.poster ? ` poster="${esc(m.poster)}"` : ""} data-src="${esc(m.src)}" aria-label="${alt}"></video>`;
      inner += `<button class="m__sound" type="button" aria-pressed="false" aria-label="Unmute: ${alt}">${ICON.muted}</button>`;
    } else if (!empty) {
      inner += `<img src="${esc(m.src)}" alt="${alt}" loading="lazy" decoding="async">`;
    }
    const link = empty && m.link;
    if (link) inner += `<a class="m__link" href="${esc(m.link)}" target="_blank" rel="noopener">${ICON.play}<span>${esc(m.linkLabel || "Watch")}</span><small>on Instagram</small></a>`;
    const role = empty && !link ? ` role="img" aria-label="${alt}. Placeholder for ${esc(slot)}."` : "";
    const el = `<div class="m${empty ? " is-empty" : ""}${link ? " has-link" : ""}" style="--ar:${a} / ${b}" data-slot="${esc(slot)}"${mask ? " data-mask" : ""}${role}>${inner}</div>`;
    return phone ? `<div class="phone" data-a>${el}</div>` : el;
  }

  const logo = (light) => {
    const src = light ? C.brand.logoLight || C.brand.logo : C.brand.logo;
    return src
      ? `<img src="${esc(src)}" alt="${esc(C.brand.name)}">`
      : `<span class="wordmark" aria-label="${esc(C.brand.name)}"><b>Curated</b><small>by Kea</small></span>`;
  };
  const eyebrow = (s) => `<p class="eyebrow" data-a>${t(s)}</p>`;
  const ig = (handle, url) => `<a class="ig" href="${esc(url)}" target="_blank" rel="noopener">${ICON.ig}<span>${esc(handle)}</span></a>`;

  /* ------------------------------------------------------------ slides */
  const order = C.order.filter((id) => id);
  const numOf = (id) => order.indexOf(id) + 1;

  const S = {};
  const chapterOf = C.labels || {};
  const toneOf = {
    cover: "film", us: "plum", days: "ivory", vision: "blush-soft", vendors: "plum-deep",
    why: "ivory-deep", team: "ivory", stephen: "plum-deep", options: "blush-soft", logistics: "ivory", reserve: "ivory-deep",
  };

  S.cover = () => {
    const c = C.cover, v = M[c.video] || {};
    const bg = v.src
      ? `<video class="kb-off" muted loop playsinline autoplay preload="auto"${v.poster ? ` poster="${esc(v.poster)}"` : ""} src="${esc(v.src)}" aria-label="${esc(v.alt)}"></video>`
      : c.fallbackImage
        ? `<img class="kb" src="${esc(c.fallbackImage)}" alt="${esc(v.alt || "")}">`
        : `<canvas class="kb" id="lake" role="img" aria-label="${esc(v.alt || "Lake Como at golden hour")}"></canvas>`;
    const lines = c.headline.map((l) => `<span class="line ${l.style}">${words(l.text)}</span>`).join("");
    return `
      <div class="cover__bg">${bg}</div>
      <div class="cover__scrim"></div>
      <div class="cover__reel${c.reel ? "" : " no-reel"}">
      ${c.reel ? `<div class="cover__phone">${media(c.reel, { phone: true, mask: false })}</div>` : ""}
      <div class="stamp" aria-hidden="true">
        <svg viewBox="0 0 120 120"><defs><path id="stampPath" d="M60 60m-46 0a46 46 0 1 1 92 0a46 46 0 1 1-92 0"/></defs>
        <circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width=".6" opacity=".6"/>
        <circle cx="60" cy="60" r="36" fill="none" stroke="currentColor" stroke-width=".6" opacity=".6"/>
        <text><textPath href="#stampPath">${esc(c.stamp.repeat(2))}</textPath></text></svg>
        <span class="core">VII</span>
      </div>
      </div>
      <div class="slide__body"><div class="wrap cover__content">
        <h1 class="cover__h">${lines}</h1>
        <p class="cover__sub" data-a>${t(c.subline)}</p>
        <a class="cover__begin" href="#${order[1] || "cover"}" data-next data-a>${esc(c.begin)}<span class="line"></span></a>
      </div></div>`;
  };

  S.vision = () => {
    const v = C.vision;
    return `<div class="slide__body"><div class="wrap">
      <div class="vision__head"><div>${eyebrow(v.eyebrow)}<h2 class="display" data-a>${esc(v.title)}</h2></div><p class="lead" data-a>${esc(v.intro)}</p></div>
      <ol class="pillars">${v.pillars.map((p, i) => {
        const to = p.id === "vendors" && order.includes("vendors") ? "vendors" : null;
        const inner = `${p.image ? media(p.image) : ""}<span class="n">${pad(i + 1)}</span><span class="t">${esc(p.title)}</span><span class="l">${t(p.line)}</span>`;
        return `<li data-a>${to ? `<a href="#${to}">${inner}</a>` : inner}</li>`;
      }).join("")}</ol>
    </div></div>`;
  };

  S.vendors = () => {
    const v = C.vendors;
    return `<div class="slide__body"><div class="wrap vendors">
      <div>${eyebrow(v.eyebrow)}<h2 class="display" data-a>${esc(v.title)}</h2><p class="body" data-a>${t(v.body)}</p>
        <ul class="vlist" data-a>${v.list.map((x) => `<li class="${x.lat == null ? "unpinned" : ""}"><i aria-hidden="true"></i><b>${esc(x.name)}</b><span>${esc(x.role)} · ${t(x.home)}</span></li>`).join("")}</ul>
      </div>
      <div class="map" data-a><div class="map__svg"></div><p class="label map__note">${esc(v.mapNote)}</p></div>
    </div></div>`;
  };

  S.team = () => {
    const k = C.team.kea;
    return `<div class="slide__body"><div class="wrap">
      <div class="team">
        <div class="phone-col">${media(k.video, { phone: true })}</div>
        <div>${eyebrow(C.team.eyebrow)}
          <h2 class="team__name" data-a>${esc(k.name)}</h2>
          <p class="label team__role" data-a>${esc(k.role)}</p>
          ${k.tagline ? `<p class="team__tag" data-a>${esc(k.tagline)}</p>` : ""}
          <p class="body" data-a>${t(k.bio)}</p>
          ${statRow(k.stats)}
          <div data-a>${ig(k.instagram, k.instagramUrl)}</div>
          ${order.includes("stephen") ? `<p class="team__next" data-a><a href="#stephen">${t(C.team.optionTwoNote)}</a></p>` : ""}
        </div>
      </div>
    </div></div>`;
  };

  const statRow = (stats = []) => stats.length ? `<ul class="creds" data-a>${stats.map((x) => `<li><b>${esc(x.value)}</b><span class="label">${esc(x.label)}</span></li>`).join("")}</ul>` : "";

  S.stephen = () => {
    const p = C.stephen;
    return `<div class="slide__body"><div class="wrap">
      <div class="team team--second">
        <div>${eyebrow(p.eyebrow)}
          <p class="mate__tag" data-a>${esc(p.tag)}</p>
          <h2 class="team__name" data-a>${esc(p.name)}</h2>
          <p class="label team__role" data-a>${esc(p.role)}</p>
          <p class="body" data-a>${t(p.lead)}</p>
          ${statRow(p.stats)}
          <p class="partners" data-a><span class="label">${esc(p.partnersLabel)}</span>${p.partners.map((x) => `<b>${esc(x)}</b>`).join('<i aria-hidden="true">·</i>')}</p>
          <p class="second__also" data-a>${t(p.also)}</p>
          <div data-a>${ig(p.instagram, p.instagramUrl)}</div>
        </div>
        <div class="second__side">
          <div class="phone-col">${media(p.video, { phone: true })}</div>
          <div class="two" data-a><p class="label">${esc(p.twoTitle)}</p>
            <ol>${p.two.map((x, i) => `<li><span class="two__n">${i + 1}</span><div><b>${esc(x.title)}</b><p>${t(x.line)}</p></div></li>`).join("")}</ol>
          </div>
        </div>
      </div>
    </div></div>`;
  };

  const rollHTML = (n) => {
    const s = Number(n).toLocaleString("en-US");
    return `<span class="cur">$</span>` + [...s].map((ch) => /\d/.test(ch)
      ? `<span class="roll" data-d="${ch}"><span style="transform:translateY(-${ch}em)">${"0123456789".split("").map((d) => `<span>${d}</span>`).join("")}</span></span>`
      : `<span>${ch}</span>`).join("");
  };
  const toggle = (name) => `<div class="toggle" role="group" aria-label="Coverage option" data-toggle="${name}" data-sel="one" data-a>
      <span class="toggle__pill" aria-hidden="true"></span>
      ${C.options.items.map((o, i) => `<button type="button" data-opt="${o.id}" aria-pressed="${i === 0}">${esc(o.tab)}</button>`).join("")}
    </div>`;

  S.options = () => {
    const o = C.options, k = C.team.kea;
    const st = { ...C.stephen, role: "Second shooter · Cinematic filmmaker", bio: "12+ years in video production. 40K+ followers built on cinematic content" };
    const mate = (p, tag, reel) => `<div class="mate">
        <div class="phone">${media(reel, { mask: false })}</div>
        <div>${tag ? `<span class="mate__tag">${esc(tag)}</span>` : ""}<p class="mate__name">${esc(p.name)}</p><p>${t(p.role)}${p.bio && tag ? `. ${t(p.bio)}` : ""}</p>${ig(p.instagram, p.instagramUrl)}</div>
      </div>`;
    const max = Math.max(...o.hours.map((h) => h.hours));
    return `<div class="slide__body"><div class="wrap opts">
      <div>
        ${eyebrow(o.eyebrow)}<h2 class="display" data-a>${esc(o.title)}</h2>
        ${toggle("options")}
        <div class="price" data-a><div class="price__num" aria-live="polite" aria-atomic="true"><span class="sr-only" data-price-sr>${money(o.items[0].price)}</span><span aria-hidden="true" data-price>${rollHTML(o.items[0].price)}</span></div><span class="label">${esc(o.priceLabel)}</span></div>
        <p class="opts__note" data-a>${esc(o.note)}</p>
      </div>
      <div>
        <div class="panels" data-a>
          ${o.items.map((it, i) => `<div class="panel" data-panel="${it.id}" aria-hidden="${i !== 0}">
            <p class="label panel__tab">${esc(it.tab)} · <span class="panel__price">${money(it.price)}</span></p>
            <h3 class="panel__title">${esc(it.title)}</h3><p class="panel__line">${t(it.line)}</p>
            ${it.id === "two" ? mate(st, "Joins in Option Two", st.video) : mate(k, "", k.video)}
          </div>`).join("")}
        </div>
        <div class="hours" data-a>
          <h3>${esc(o.hoursTitle)}</h3><span class="label">${esc(o.hoursLabel)}</span>
          <ul>${o.hours.map((h) => `<li><span class="ev">${esc(h.event)}</span><span class="hr">Up to ${h.hours} hours</span><span class="bar"><i style="--w:${(h.hours / max) * 100}%"></i></span></li>`).join("")}</ul>
          <div class="scale" aria-hidden="true"><span>0</span><span>${max / 2} hrs</span><span>${max} hrs</span></div>
        </div>
      </div>
    </div></div>`;
  };

  const accordion = (items, key) => items.map((it, i) => `<div class="acc" data-a><h3><button type="button" aria-expanded="false" aria-controls="${key}-${i}" id="${key}-b-${i}">${esc(it.title)}<span class="pm" aria-hidden="true"></span></button></h3>
        <div class="acc__panel" id="${key}-${i}" role="region" aria-labelledby="${key}-b-${i}"><div><p>${t(it.body)}</p></div></div></div>`).join("");

  S.us = () => {
    const u = C.us;
    const html = words(u.quote).replace(/class="w">(Sam|JT)</g, 'class="w hl">$1<');
    return `<div class="slide__body"><div class="wrap us">
      ${eyebrow(u.eyebrow)}
      <figure class="quote" style="margin:0"><blockquote><p>${html}</p></blockquote><footer data-a>${esc(u.attribution)}</footer></figure>
      <ol class="beats">${u.beats.map((b) => `<li data-a><b>${esc(b.big)}</b><span class="label">${esc(b.label)}</span><p>${t(b.line)}</p></li>`).join("")}</ol>
    </div></div>`;
  };

  S.days = () => {
    const d = C.days;
    return `<div class="slide__body"><div class="wrap days">
      <div class="days__head">${eyebrow(d.eyebrow)}<h2 class="display" data-a>${esc(d.title)}</h2>
        <p class="where" data-a>${ICON.pin}<span>${esc(d.location)}</span></p></div>
      <ol class="days__list">${d.days.map((x) => `<li class="dayc">
        <div class="dayc__phone">${media(x.video, { phone: true })}</div>
        <div data-a><p class="label">${esc(x.date)}</p><h3 class="dayc__it">${esc(x.italian)}</h3><p class="dayc__title">${esc(x.title)}</p><p class="dayc__line">${t(x.line)}</p></div>
      </li>`).join("")}</ol>
    </div></div>`;
  };

  S.why = () => {
    const y = C.why, d = C.why;
    return `<div class="slide__body"><div class="wrap why">
      <div>${eyebrow(y.eyebrow)}<h2 class="display" data-a>${esc(y.title)}</h2><p class="lead" data-a>${t(y.body)}</p>
        <div class="stats">${d.stats.map((x) => `<div class="stat" data-a><div class="stat__v"><b>${esc(x.value)}</b><span>${esc(x.unit)}</span></div><span class="label">${esc(x.label)}</span><p>${t(x.note)}</p></div>`).join("")}</div>
      </div>
      <div class="dlist" data-a><h3>${esc(d.listTitle)}</h3><ul>${d.rows.map((r) => `<li><b>${t(r.item)}</b><span>${t(r.detail)}</span></li>`).join("")}</ul></div>
    </div></div>`;
  };

  S.logistics = () => {
    const l = C.logistics, icons = [ICON.stay, ICON.car, ICON.meal];
    return `<div class="slide__body"><div class="wrap logistics">
      <div class="logistics__head">${eyebrow(l.eyebrow)}<h2 class="display" data-a>${esc(l.title)}</h2></div>
      <div class="logistics__needs">${l.columns.map((c, i) => `<section class="need" data-a><span class="col__icon">${icons[i] || ""}</span><div><h3>${esc(c.title)}</h3><p class="need__lead">${t(c.lead)}</p>${c.items.length ? `<ul>${c.items.map((x) => `<li>${t(x)}</li>`).join("")}</ul>` : ""}</div></section>`).join("")}</div>
      <div class="logistics__terms"><p class="label" data-a>${esc(l.termsTitle)}</p>${accordion(l.terms, "terms")}</div>
    </div></div>`;
  };

  S.reserve = () => {
    const r = C.reserve;
    const sched = (id) => {
      const s = r.schedules[id], opt = C.options.items.find((o) => o.id === id);
      const total = s.reduce((a, x) => a + x.amount, 0);
      return `<div data-sched="${id}" aria-hidden="${id !== "one"}">
        <p class="label sched__name">${esc(opt ? opt.tab : id)}</p>
        <ol class="steps"><span class="link" aria-hidden="true"></span>${s.map((x, i) => `<li><span class="dot">${i + 1}</span><span class="label when">${esc(x.when)}</span><span class="amt">${money(x.amount)}</span><span class="what">${t(x.what)}</span></li>`).join("")}</ol>
        <p class="total"><span class="label">Total travel investment</span><b>${money(total)}</b></p>
      </div>`;
    };
    const has = !!r.ctaUrl;
    return `<div class="slide__body"><div class="wrap reserve">
      <div>${eyebrow(r.eyebrow)}<h2 class="display" data-a>${esc(r.title)}</h2>${toggle("reserve")}</div>
      <div>
        <div class="sched" data-a>${Object.keys(r.schedules).map(sched).join("")}</div>
        <p class="reserve__note" data-a>${t(r.note)}</p>
        <div data-a><a class="cta${has ? "" : " is-placeholder"}" href="${has ? esc(r.ctaUrl) : "#reserve"}"${has ? ' target="_blank" rel="noopener"' : ""}><span>${esc(r.cta)}</span>${ICON.next}</a>
        ${has ? "" : `<span class="cta__flag">${t("[CONFIRM booking or contact link in content.js]")}</span>`}</div>
        ${r.signoff ? `<div class="signoff" data-a><span class="signoff__line">${esc(r.signoff)}</span><span class="logo">${logo(false)}</span><a class="ig" href="${esc(C.brand.instagramUrl)}" target="_blank" rel="noopener">${ICON.ig}<span>${esc(C.brand.instagram)}</span></a></div>` : ""}
      </div>
    </div></div>`;
  };

  /* ------------------------------------------------------------ type */
  // Typeface comes from content.js; the review switcher (typePicker) can
  // override it for this browser only.
  const TYPES = [["couture", "Couture"], ["villa", "Villa"], ["modern", "Modern"], ["original", "Original"]];
  let typeface = C.typeface || "couture";
  if (C.typePicker) { try { typeface = localStorage.getItem("sjt-type") || typeface; } catch (e) { /* storage blocked */ } }
  if (!TYPES.some((x) => x[0] === typeface)) typeface = "couture";
  document.documentElement.dataset.type = typeface;
  const typeBtn = $("#typeBtn");
  if (C.typePicker && typeBtn) {
    typeBtn.hidden = false;
    const label = () => { typeBtn.querySelector("span").textContent = TYPES.find((x) => x[0] === typeface)[1]; };
    label();
    typeBtn.addEventListener("click", () => {
      typeface = TYPES[(TYPES.findIndex((x) => x[0] === typeface) + 1) % TYPES.length][0];
      document.documentElement.dataset.type = typeface;
      try { localStorage.setItem("sjt-type", typeface); } catch (e) { /* storage blocked */ }
      label();
      dispatchEvent(new Event("resize"));
    });
  }

  /* ------------------------------------------------------------ mount */
  document.title = C.meta.title;
  const deck = $("#deck");
  deck.innerHTML = order.filter((id) => S[id]).map((id, i) =>
    `<section class="slide s-${id} tone-${toneOf[id] || "ivory"}" id="${id}" data-id="${id}" tabindex="-1" aria-roledescription="slide" aria-label="${i + 1} of ${order.length}: ${esc(chapterOf[id] || id)}">
      ${S[id]()}
      <div class="folio" aria-hidden="true">
        <span class="folio__nav">${i > 0 ? `<a href="#${order[i - 1]}">Previous</a>` : ""}${id !== "contents" && order.includes("contents") ? `<a href="#contents">Contents</a>` : ""}</span>
        <span>${esc(C.meta.title)}</span>
        <span class="folio__nav"><span>${pad(i + 1)} / ${pad(order.length)}</span>${i < order.length - 1 ? `<a href="#${order[i + 1]}">Next</a>` : `<a href="#cover">Back to the start</a>`}</span>
      </div>
    </section>`).join("");
  const slides = $$(".slide", deck);
  const ids = slides.map((s) => s.id);
  const isDark = (s) => /tone-(plum|plum-deep|film)/.test(s.className);

  $("#logo").innerHTML = logo(false);
  const menuChapters = ids.filter((id) => id !== "cover").map((id) => ({ to: id, label: chapterOf[id] || id }));

      ctx.fillStyle = water; ctx.fillRect(0, hz, w, h - hz);
      const col = ctx.createLinearGradient(sunX - w * .12, 0, sunX + w * .12, 0);
      col.addColorStop(0, "rgba(255, 214, 170, 0)"); col.addColorStop(.5, "rgba(255, 214, 170, .22)"); col.addColorStop(1, "rgba(255, 214, 170, 0)");
      ctx.fillStyle = col; ctx.fillRect(sunX - w * .12, hz, w * .24, h - hz);
      ctx.lineCap = "round";
      glints.forEach((g) => {
        const a = Math.max(0, Math.sin(s * g.sp + g.ph)) * (g.near ? .75 : .28);
        if (a < .02) return;
        const x = g.x + Math.sin(s * .25 + g.ph) * 5;
        ctx.strokeStyle = `rgba(255, 232, 205, ${a.toFixed(3)})`;
        ctx.lineWidth = g.y > hz + (h - hz) * .5 ? 1.4 : 1;
        ctx.beginPath(); ctx.moveTo(x - g.len / 2, g.y); ctx.lineTo(x + g.len / 2, g.y); ctx.stroke();
      });
    }
    function loop(tm) { if (!on) return; if (tm - last > 33) { draw(tm); last = tm; } raf = requestAnimationFrame(loop); }
    build(); draw(1200);
    addEventListener("resize", () => { build(); draw(performance.now()); });
    addEventListener("beforeprint", () => { build(); draw(1200); });
    return {
      toggle(v) {
        if (reduced) return;
        if (v && !on) { on = true; raf = requestAnimationFrame(loop); }
        else if (!v && on) { on = false; cancelAnimationFrame(raf); }
      },
    };
  })();

  /* ------------------------------------------------------------ opening graphic */
  // Lake Como draws itself as an inverted Y, the monogram resolves from blur,
  // then the curtain parts onto the cover.
  const intro = { active: false, skip() {} };
  function smooth(pts) {
    let d = `M${pts[0][0]} ${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0]} ${p2[1]}`;
    }
    return d;
  }
  function runIntro(onDone) {
    const el = $("#intro");
    if (!gsap || reduced) { el.remove(); onDone(); return; }
    const I = C.intro;
    const north = [[128, 12], [125, 38], [118, 66], [111, 94], [106, 122], [101, 148], [100, 158]];
    const west = [[100, 158], [90, 167], [77, 177], [65, 191], [55, 209], [47, 229], [41, 247], [34, 264]];
    const east = [[100, 158], [107, 173], [113, 193], [117, 215], [121, 239], [127, 264]];
    const paths = [north, west, east].map(smooth);
    el.innerHTML = `
      <div class="intro__panel intro__panel--top"></div><div class="intro__panel intro__panel--bottom"></div>
      <div class="intro__grain"></div>
      <div class="intro__stage">
        <p class="intro__coords" style="margin:0">${esc(I.coords)}</p>
        <svg class="intro__lake" viewBox="0 0 200 280" aria-hidden="true">
          ${paths.map((p) => `<path class="water" d="${p}" pathLength="1"/>`).join("")}
          ${paths.map((p) => `<path class="shore" d="${p}" pathLength="1"/>`).join("")}
          <circle class="town" cx="34" cy="264" r="2.2"/><text x="26" y="266" text-anchor="end">Como</text>
          <circle class="town" cx="127" cy="264" r="2.2"/><text x="135" y="266">Lecco</text>
          <circle class="town" cx="100" cy="158" r="2.2"/><text x="110" y="156">Bellagio</text>
        </svg>
        <p class="intro__mono">${esc(I.monogram).replace("&amp;", "<span>&amp;</span>")}</p>
        <p class="intro__place">${esc(I.place)}</p>
        <p class="intro__date" style="margin:0">${esc(I.date)}</p>
      </div>
      <button class="intro__skip" type="button">${esc(I.skip)}</button>`;
    const stage = $(".intro__stage", el), top = $(".intro__panel--top", el), bottom = $(".intro__panel--bottom", el);
    const shores = $$(".shore", el), waters = $$(".water", el);
    intro.active = true;
    let finished = false;
    const finish = () => {
      if (finished) return; finished = true;
      intro.active = false; el.remove(); onDone();
    };
    const tl = gsap.timeline({ onComplete: finish });
    tl.set([shores, waters], { strokeDasharray: 1, strokeDashoffset: 1 })
      .from(".intro__coords", { opacity: 0, letterSpacing: ".6em", duration: 1.4, ease: "expo.out" }, .1)
      .to(shores[0], { strokeDashoffset: 0, duration: 1.1, ease: "power2.inOut" }, .25)
      .to([shores[1], shores[2]], { strokeDashoffset: 0, duration: 1.1, ease: "power2.inOut" }, 1.05)
      .to(waters, { strokeDashoffset: 0, duration: 1.6, ease: "power2.inOut", stagger: .15 }, .7)
      .from($$(".town, .intro__lake text", el), { opacity: 0, duration: .6, stagger: .08 }, 1.7)
      .from(".intro__mono", { opacity: 0, filter: "blur(16px)", y: 10, duration: 1.3, ease: "power2.out" }, 1.55)
      .from([".intro__place", ".intro__date"], { opacity: 0, y: 8, duration: .9, ease: "expo.out", stagger: .12 }, 1.95)
      .to(stage, { opacity: 0, y: -14, filter: "blur(6px)", duration: .7, ease: "power2.in" }, 3.35)
      .to(".intro__grain", { opacity: 0, duration: .5 }, 3.35)
      .add(() => { el.style.pointerEvents = "none"; enter(slides[0], .35); }, 3.75)
      .to(top, { yPercent: -100, duration: 1.2, ease: "expo.inOut" }, 3.75)
      .to(bottom, { yPercent: 100, duration: 1.2, ease: "expo.inOut" }, 3.75);
    let seen = false; try { seen = sessionStorage.getItem("sjt-intro") === "1"; sessionStorage.setItem("sjt-intro", "1"); } catch (e) { /* storage blocked */ }
    if (seen) tl.timeScale(1.8);
    intro.skip = () => { if (tl.time() < 3.3) tl.seek(3.3); };
    $(".intro__skip", el).addEventListener("click", intro.skip);
    el.addEventListener("click", (e) => { if (!e.target.closest(".intro__skip")) intro.skip(); });
  }

  /* ------------------------------------------------------------ boot */
  setOption("one");
  const startId = (location.hash || "").slice(1);
  const start = Math.max(0, ids.indexOf(startId));
  if (start === 0) {
    // Show the cover underneath the curtain, then let the intro hand off to it.
    cur = 0; slides[0].classList.add("is-active"); chrome(0); Media.activate(0);
    if (gsap && !reduced) gsap.set($$(".cover__h .w, .s-cover [data-a]"), { opacity: 0 });
    runIntro(() => { if (!gsap || reduced) enter(slides[0], 0); });
  } else {
    $("#intro").remove();
    go(start, { instant: true });
  }
  document.documentElement.classList.add("is-ready");
})();

</script>
</body>
</html>
