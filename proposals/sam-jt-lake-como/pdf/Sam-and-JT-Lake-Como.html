:root {
  /* Palette · from the couple's wedding colors */
  --ivory: #f7f0e7;
  --ivory-deep: #efe3d4;
  --blush: #e9c3bc;
  --blush-soft: #f4dfd9;
  --prosecco: #dcc393;
  --prosecco-deep: #9c7b43;
  --plum: #4f1a3e;
  --plum-deep: #2a0c1f;
  --ink: #1a1216;
  --ink-soft: #5d4a52;

  /* Type */
  --serif: "Bodoni Moda", "Bodoni 72", Didot, "Didot LT STD", Georgia, serif;
  --sans: "Jost", "Futura PT", Futura, "Avenir Next", "Helvetica Neue", Arial, sans-serif;

  --fs-mega: clamp(3.4rem, 12.5vw, 10.5rem);
  --fs-h1: clamp(2.5rem, 7.4vw, 6rem);
  --fs-h2: clamp(2.1rem, 5.2vw, 4.4rem);
  --fs-h3: clamp(1.45rem, 2.6vw, 2.15rem);
  --fs-lead: clamp(1.06rem, 1.45vw, 1.28rem);
  --fs-body: 1rem;
  --fs-small: .875rem;
  --fs-label: .7rem;
  --track-label: .3em;

  /* Space */
  --gutter: clamp(1.25rem, 5vw, 4.5rem);
  --chrome-h: 64px;
  --ease: cubic-bezier(.22, .7, .12, 1);
  --ease-io: cubic-bezier(.65, 0, .25, 1);

  color-scheme: light;
}

/* Slide tones. Components read --bg/--fg/--muted/--accent/--rule only. */
.tone-ivory      { --bg: var(--ivory);      --fg: var(--ink);   --muted: var(--ink-soft); --accent: var(--plum);     --soft: var(--blush-soft); --rule: rgba(26, 18, 22, .16); }
.tone-ivory-deep { --bg: var(--ivory-deep); --fg: var(--ink);   --muted: var(--ink-soft); --accent: var(--plum);     --soft: var(--ivory);      --rule: rgba(26, 18, 22, .16); }
.tone-blush      { --bg: var(--blush);      --fg: var(--ink);   --muted: #4f3b43;         --accent: var(--plum);     --soft: var(--blush-soft); --rule: rgba(26, 18, 22, .18); }
.tone-blush-soft { --bg: var(--blush-soft); --fg: var(--ink);   --muted: #56434b;         --accent: var(--plum);     --soft: var(--ivory);      --rule: rgba(26, 18, 22, .16); }
.tone-plum       { --bg: var(--plum);       --fg: var(--ivory); --muted: #e3cfd6;         --accent: var(--prosecco); --soft: #5e2a4c;           --rule: rgba(247, 240, 231, .2); }
.tone-plum-deep  { --bg: var(--plum-deep);  --fg: var(--ivory); --muted: #dcc6cf;         --accent: var(--prosecco); --soft: #3c1630;           --rule: rgba(247, 240, 231, .18); }
.tone-film       { --bg: var(--ink);        --fg: var(--ivory); --muted: #e8dcd6;         --accent: var(--prosecco); --soft: #2c2026;           --rule: rgba(247, 240, 231, .22); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--plum-deep);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--fs-body);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  overscroll-behavior: none;
}
img, video, svg, canvas { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent, var(--plum)); outline-offset: 4px; border-radius: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Type primitives ---------- */
.eyebrow {
  display: flex; align-items: center; gap: .9em;
  margin: 0 0 1.4rem;
  font: 500 var(--fs-label)/1.3 var(--sans);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--accent);
}
.eyebrow::before { content: ""; width: 2.2em; height: 1px; background: currentColor; flex: none; }
.display {
  margin: 0;
  font-family: var(--serif);
  font-weight: 500;
  font-size: var(--fs-h2);
  line-height: 1.02;
  letter-spacing: -.012em;
  text-wrap: balance;
  color: var(--fg);
}
.display em, .italic { font-style: italic; font-weight: 400; }
.display em { color: var(--accent); }
.lead { font-size: var(--fs-lead); line-height: 1.6; color: var(--muted); max-width: 36em; margin: 1.4rem 0 0; }
.body { color: var(--muted); max-width: 34em; margin: 0; }
.body + .body { margin-top: 1em; }
.label {
  font: 500 var(--fs-label)/1.3 var(--sans);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--muted);
}
.flag {
  display: inline;
  padding: .05em .35em;
  border: 1px dashed currentColor;
  border-radius: 3px;
  opacity: .82;
  font-style: normal;
  box-decoration-break: clone; -webkit-box-decoration-break: clone;
}
.tabular { font-variant-numeric: lining-nums tabular-nums; }

/* ---------- Deck stage ---------- */
.deck { position: fixed; inset: 0; overflow: hidden; background: var(--plum-deep); }
.slide {
  position: absolute; inset: 0;
  overflow-x: hidden; overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
  color: var(--fg);
  visibility: hidden;
  scrollbar-width: none;
}
.slide::-webkit-scrollbar { display: none; }
.slide.is-active, .slide.is-leaving { visibility: visible; }
.slide.is-active { z-index: 2; }
.slide.is-leaving { z-index: 1; }
.slide:focus { outline: none; }
.slide__body {
  position: relative;
  min-height: 100%;
  display: flex; align-items: center;
  padding-inline: var(--gutter);
  padding-block: calc(var(--chrome-h) + env(safe-area-inset-top, 0px) + 1.25rem) calc(var(--chrome-h) + env(safe-area-inset-bottom, 0px) + 2rem);
}
.wrap { width: 100%; max-width: 1320px; margin-inline: auto; min-width: 0; }
.folio { display: none; }

/* ---------- Chrome ---------- */
.chrome {
  position: fixed; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding-inline: var(--gutter);
  color: var(--chrome-fg, var(--ink));
  transition: color .6s var(--ease);
  pointer-events: none;
}
.chrome > * { pointer-events: auto; }
body[data-tone="dark"] { --chrome-fg: var(--ivory); --chrome-dim: rgba(247, 240, 231, .5); --chrome-glass: rgba(26, 12, 22, .35); }
body[data-tone="light"] { --chrome-fg: var(--ink); --chrome-dim: rgba(26, 18, 22, .38); --chrome-glass: rgba(247, 240, 231, .6); }
.chrome--top { top: 0; height: calc(var(--chrome-h) + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); }
.chrome--bottom { bottom: 0; height: calc(var(--chrome-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }

.logo { display: inline-flex; align-items: center; gap: .6rem; text-decoration: none; min-width: 0; }
.logo img { height: 28px; width: auto; }
.logo__word { font: italic 500 1.05rem/1 var(--serif); letter-spacing: .01em; white-space: nowrap; }
.logo__slot {
  font: 500 .56rem/1 var(--sans); letter-spacing: .22em; text-transform: uppercase;
  padding: .35em .5em; border: 1px dashed currentColor; border-radius: 3px; opacity: .55; white-space: nowrap;
}
.chrome__right { display: flex; align-items: center; gap: 1.1rem; }
.counter { font: 500 .72rem/1 var(--sans); letter-spacing: .2em; color: var(--chrome-dim); white-space: nowrap; }
@media (max-width: 480px) { .counter, .logo__slot { display: none; } }
/* On phones, tall slides scroll under the chrome: give it a soft ground. */
@media (max-width: 899px) {
  .chrome--top { background: linear-gradient(180deg, var(--chrome-bg, transparent) 55%, transparent); }
  .chrome--bottom { background: linear-gradient(0deg, var(--chrome-bg, transparent) 60%, transparent); }
  body[data-tone="dark"] .chrome { background: none; }
}
.counter b { color: var(--chrome-fg); font-weight: 500; }
.menu-btn { display: inline-flex; align-items: center; gap: .6rem; font: 500 .68rem/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; padding: .7rem 0; }
.menu-btn i { display: grid; gap: 5px; width: 22px; }
.menu-btn i::before, .menu-btn i::after { content: ""; height: 1px; background: currentColor; }
.menu-btn i::after { width: 14px; justify-self: end; }

.nav-btn {
  width: 46px; height: 46px; flex: none;
  display: grid; place-items: center;
  border: 1px solid var(--chrome-dim); border-radius: 50%;
  background: var(--chrome-glass);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: border-color .3s, transform .3s var(--ease), opacity .3s;
}
.nav-btn:hover { border-color: var(--chrome-fg); transform: scale(1.05); }
.nav-btn:disabled { opacity: .25; cursor: default; transform: none; }
.nav-btn svg { width: 18px; height: 18px; }
.progress { flex: 1; display: flex; flex-direction: column; gap: .55rem; min-width: 0; max-width: 560px; }
.progress__title { font: 500 .66rem/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; text-align: center; color: var(--chrome-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress__ticks { display: flex; gap: 3px; }
.progress__ticks button { flex: 1; height: 14px; position: relative; }
.progress__ticks button::after {
  content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px;
  background: var(--chrome-dim); opacity: .55; transition: background .4s, opacity .4s;
}
.progress__ticks button.is-past::after { background: var(--chrome-fg); opacity: .55; }
.progress__ticks button.is-current::after { background: var(--chrome-fg); opacity: 1; height: 2px; }

/* ---------- Menu overlay ---------- */
.menu {
  position: fixed; inset: 0; z-index: 40;
  background: var(--plum-deep); color: var(--ivory);
  --accent: var(--prosecco); --muted: #dcc6cf; --rule: rgba(247, 240, 231, .16); --fg: var(--ivory);
  display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 1rem) var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
  overflow-y: auto;
}
.menu__top { display: flex; justify-content: space-between; align-items: center; height: var(--chrome-h); }
.menu__close { font: 500 .68rem/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; padding: .7rem 0; }
.menu__list { list-style: none; margin: auto 0; padding: 1.5rem 0; max-width: 980px; width: 100%; align-self: center; }

.chapters { list-style: none; margin: 0; padding: 0; counter-reset: ch; }
.chapters li { border-top: 1px solid var(--rule); }
.chapters li:last-child { border-bottom: 1px solid var(--rule); }
.chapters a {
  display: grid; grid-template-columns: 2.4rem 1fr auto; align-items: baseline; gap: .8rem;
  padding: .72rem 0;
  text-decoration: none;
  position: relative;
}
.chapters a::after {
  content: ""; position: absolute; left: 0; bottom: -1px; height: 1px; width: 100%;
  background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .6s var(--ease);
}
.chapters a:hover::after, .chapters a:focus-visible::after { transform: scaleX(1); }
.chapters .n { font: 500 .7rem/1 var(--sans); letter-spacing: .18em; color: var(--accent); }
.chapters .t { font: 400 clamp(1.25rem, 2.4vw, 1.9rem)/1.15 var(--serif); color: var(--fg); transition: transform .5s var(--ease); }
.chapters a:hover .t { transform: translateX(.4rem); font-style: italic; }
.chapters .p { font: 500 .7rem/1 var(--sans); letter-spacing: .18em; color: var(--muted); }

/* ---------- Intro (opening graphic) ---------- */
.intro {
  position: fixed; inset: 0; z-index: 60;
  display: grid; place-items: center;
  color: var(--ivory);
  pointer-events: auto;
}
.intro__panel { position: absolute; left: 0; right: 0; height: 50.5%; background: var(--plum-deep); }
.intro__panel--top { top: 0; }
.intro__panel--bottom { bottom: 0; }
.intro__grain {
  position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background: radial-gradient(ellipse 60% 50% at 50% 45%, rgba(220, 195, 147, .14), transparent 70%);
}
.intro__stage { position: relative; display: grid; justify-items: center; gap: 1.1rem; text-align: center; padding: 1rem; }
.intro__coords, .intro__date { font: 500 .66rem/1 var(--sans); letter-spacing: .34em; text-transform: uppercase; color: var(--prosecco); }
.intro__lake { width: clamp(150px, 30vh, 270px); height: auto; overflow: visible; }
.intro__lake .water { fill: none; stroke: rgba(233, 195, 188, .28); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
.intro__lake .shore { fill: none; stroke: var(--prosecco); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.intro__lake text { font: 500 7px var(--sans); letter-spacing: .2em; fill: var(--prosecco); text-transform: uppercase; }
.intro__lake .town { fill: var(--prosecco); }
.intro__mono { font: italic 400 clamp(3rem, 9vw, 6rem)/1 var(--serif); letter-spacing: -.01em; margin: 0; }
.intro__mono span { font-style: normal; color: var(--prosecco); font-size: .6em; vertical-align: .18em; padding-inline: .12em; }
.intro__place { font: 400 clamp(1rem, 2vw, 1.25rem)/1 var(--serif); letter-spacing: .08em; margin: 0; }
.intro__skip {
  position: absolute; right: var(--gutter); bottom: calc(env(safe-area-inset-bottom, 0px) + 1.4rem);
  font: 500 .64rem/1 var(--sans); letter-spacing: .28em; text-transform: uppercase; color: var(--ivory); opacity: .6; padding: .8rem 0;
}
.intro__skip:hover { opacity: 1; }

/* ---------- Media slots ---------- */
.m {
  position: relative;
  width: 100%; max-width: 100%;
  aspect-ratio: var(--ar, 16 / 9);
  overflow: hidden;
  background: var(--soft, var(--blush-soft));
  isolation: isolate;
}
.m > video, .m > img, .m__img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
}
.m.is-empty > video, .m.is-empty > img { display: none; }
.m__ph {
  position: absolute; inset: 0; z-index: 0;
  display: grid; place-items: center; align-content: center; gap: .55rem;
  text-align: center; padding: 1rem;
  color: var(--ph-fg, var(--plum));
  background:
    radial-gradient(120% 80% at 70% 18%, rgba(255, 244, 226, .55), transparent 55%),
    linear-gradient(160deg, var(--ph-a, var(--blush-soft)) 0%, var(--ph-b, var(--blush)) 55%, var(--ph-c, var(--prosecco)) 100%);
}
.m__ph::before {
  /* slow light across water */
  content: ""; position: absolute; inset: -20% -60%;
  background: linear-gradient(100deg, transparent 38%, rgba(255, 250, 240, .35) 50%, transparent 62%);
  animation: sheen 7s var(--ease-io) infinite;
}
.m__ph::after {
  /* crop marks */
  content: ""; position: absolute; inset: 12px;
  background:
    linear-gradient(currentColor, currentColor) top left / 14px 1px no-repeat,
    linear-gradient(currentColor, currentColor) top left / 1px 14px no-repeat,
    linear-gradient(currentColor, currentColor) top right / 14px 1px no-repeat,
    linear-gradient(currentColor, currentColor) top right / 1px 14px no-repeat,
    linear-gradient(currentColor, currentColor) bottom left / 14px 1px no-repeat,
    linear-gradient(currentColor, currentColor) bottom left / 1px 14px no-repeat,
    linear-gradient(currentColor, currentColor) bottom right / 14px 1px no-repeat,
    linear-gradient(currentColor, currentColor) bottom right / 1px 14px no-repeat;
  opacity: .45;
}
.m__ph svg { width: 34px; height: 34px; position: relative; opacity: .8; }
.m__ph .slot { position: relative; font: italic 400 clamp(.95rem, 1.6vw, 1.2rem)/1.1 var(--serif); }
.m__ph .spec { position: relative; font: 500 .58rem/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; opacity: .75; }
.tone-plum .m, .tone-plum-deep .m, .tone-film .m { --ph-a: #5c2549; --ph-b: #3d1231; --ph-c: #7a4a52; --ph-fg: var(--prosecco); }
@keyframes sheen { 0% { transform: translateX(-30%); } 60%, 100% { transform: translateX(30%); } }

.m__sound {
  position: absolute; z-index: 3; right: 12px; bottom: 12px;
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(26, 12, 22, .45); color: var(--ivory);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(247, 240, 231, .3);
  transition: transform .3s var(--ease), background .3s;
}
.m__sound:hover { transform: scale(1.08); background: rgba(26, 12, 22, .7); }
.m__sound svg { width: 16px; height: 16px; }
.m.is-empty .m__sound { display: none; }

/* Vertical 9:16 inside a phone frame */
.phone {
  position: relative;
  width: 100%;
  padding: 9px;
  border-radius: 40px;
  background: linear-gradient(145deg, #2d2228, #0f0a0d 60%, #2a1f25);
  box-shadow:
    0 0 0 1px rgba(220, 195, 147, .35),
    0 30px 60px -20px rgba(42, 12, 31, .45),
    0 12px 24px -12px rgba(42, 12, 31, .35);
}
.phone .m { border-radius: 32px; --ar: 9 / 16; }
.phone::before {
  content: ""; position: absolute; z-index: 4; top: 17px; left: 50%; translate: -50% 0;
  width: 30%; height: 20px; border-radius: 12px; background: #0c0709;
}

/* ---------- Shared slide layouts ---------- */
.split { display: grid; gap: clamp(2rem, 5vw, 5rem); align-items: center; }
@media (min-width: 900px) {
  .split { grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); }
  .split--reverse > :first-child { order: 2; }
  .split--phone { grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); }
}
.phone-col { width: min(100%, 300px); justify-self: center; }
@media (min-width: 900px) { .phone-col { width: min(100%, 290px, 33vh); } }

/* ---------- Cover ---------- */
.s-cover .slide__body { align-items: flex-end; padding-bottom: calc(var(--chrome-h) + env(safe-area-inset-bottom, 0px) + 2.5rem); }
.cover__bg { position: absolute; inset: 0; overflow: hidden; background: var(--plum-deep); }
.cover__bg canvas, .cover__bg video, .cover__bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover__bg .kb { animation: kenburns 26s ease-in-out infinite alternate; transform-origin: 60% 55%; }
@keyframes kenburns { from { transform: scale(1.02) translate(0, 0); } to { transform: scale(1.12) translate(-1.5%, -1%); } }
.cover__scrim {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(42, 12, 31, .55) 0%, rgba(42, 12, 31, 0) 28%),
    linear-gradient(0deg, rgba(26, 8, 20, .88) 0%, rgba(26, 8, 20, .35) 45%, rgba(26, 8, 20, 0) 70%);
}
.cover__content { position: relative; z-index: 2; }
@media (min-width: 900px) { .s-cover .cover__content { padding-right: calc(min(270px, 36vh) + 9vw); } }
.cover__h {
  margin: 0;
  font-family: var(--serif);
  color: var(--ivory);
  line-height: .95;
  letter-spacing: -.02em;
}
.cover__h .line { display: block; }
.cover__h .roman { font-size: var(--fs-mega); font-weight: 600; }
.cover__h .italic { font-size: var(--fs-mega); font-style: italic; font-weight: 400; color: var(--blush); }
.cover__h .small { font-size: clamp(1.35rem, 3.6vw, 2.7rem); font-weight: 400; font-style: italic; margin-top: .9rem; letter-spacing: -.005em; line-height: 1.15; max-width: 30ch; }
.cover__h .w { display: inline-block; will-change: filter, opacity, transform; }
.cover__sub { margin: 1.6rem 0 0; font: 500 .7rem/1.7 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--prosecco); max-width: 40em; }
.cover__begin { text-decoration: none; }
.cover__begin {
  margin-top: 2rem;
  display: inline-flex; align-items: center; gap: 1rem;
  font: 500 .7rem/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--ivory);
  padding: .6rem 0;
}
.cover__begin .line { width: 64px; height: 1px; background: rgba(247, 240, 231, .35); position: relative; overflow: hidden; }
.cover__begin .line::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--prosecco); animation: cue 2.4s var(--ease-io) infinite; }
@keyframes cue { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
.cover__reel { position: absolute; z-index: 2; right: var(--gutter); top: calc(var(--chrome-h) + env(safe-area-inset-top, 0px) + 1rem); }
.cover__phone { display: none; }
.stamp { position: relative; width: clamp(92px, 12vw, 140px); color: var(--prosecco); }
/* The couple's reel: a phone beside the headline, sealed with the stamp */
.cover__reel:not(.no-reel) { top: 50%; translate: 0 -54%; right: clamp(1.25rem, 8vw, 9rem); }
.cover__reel:not(.no-reel) .cover__phone { display: block; width: min(270px, 36vh); }
.cover__reel:not(.no-reel) .stamp { position: absolute; left: -58px; top: -46px; width: clamp(96px, 9vw, 124px); }
.cover__phone .phone { box-shadow: 0 0 0 1px rgba(220, 195, 147, .45), 0 40px 80px -30px rgba(0, 0, 0, .7); }
@media (max-width: 899px) {
  .cover__reel:not(.no-reel) { top: calc(var(--chrome-h) + env(safe-area-inset-top, 0px) + .6rem); translate: none; right: var(--gutter); }
  .cover__reel:not(.no-reel) .cover__phone { width: min(34vw, 150px, 24vh); }
  .cover__reel:not(.no-reel) .cover__phone .phone { padding: 5px; border-radius: 22px; }
  .cover__reel:not(.no-reel) .cover__phone .m { border-radius: 18px; }
  .cover__reel:not(.no-reel) .cover__phone .phone::before { top: 9px; height: 11px; }
  .cover__reel:not(.no-reel) .stamp { display: none; }
}
/* Placeholder that links out while the file isn't in /media yet */
.m__link {
  position: absolute; inset: 0; z-index: 2;
  display: grid; place-content: center; justify-items: center; gap: .45rem; text-align: center;
  color: var(--ivory); text-decoration: none;
  background: linear-gradient(180deg, rgba(42, 12, 31, .15), rgba(42, 12, 31, .55));
}
.m__link svg { width: 40px; height: 40px; transition: transform .5s var(--ease); }
.m__link span { font: italic 400 1.15rem/1.1 var(--serif); }
.m__link small { font: 500 .56rem/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--prosecco); }
.m__link:hover svg { transform: scale(1.08); }
.m.has-link .m__ph .slot, .m.has-link .m__ph .spec, .m.has-link .m__ph svg { display: none; }
.stamp svg { width: 100%; height: auto; animation: spin 40s linear infinite; }
.stamp text { font: 500 8.6px var(--sans); letter-spacing: 2.6px; text-transform: uppercase; fill: currentColor; }
.stamp .core { position: absolute; inset: 0; display: grid; place-items: center; font: italic 400 clamp(.95rem, 1.6vw, 1.3rem)/1 var(--serif); color: var(--ivory); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Meet Kea ---------- */
.team { display: grid; gap: 2.4rem; align-items: center; }
@media (min-width: 900px) { .team { grid-template-columns: minmax(0, .7fr) minmax(0, 1.3fr); gap: 5rem; } }
.team__name { margin: 0; font: italic 400 clamp(5rem, 16vw, 11rem)/.85 var(--serif); letter-spacing: -.03em; color: var(--fg); }
.team__role { margin-top: 1.4rem; }
.team .body { margin-top: 1.2rem; font-size: var(--fs-lead); }
.ig { display: inline-flex; align-items: center; gap: .55rem; margin-top: 1.6rem; font: 500 .72rem/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); text-decoration: none; padding: .5rem 0; border-bottom: 1px solid currentColor; }
.ig svg { width: 15px; height: 15px; }
.team__next { margin-top: 2.4rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); font-size: var(--fs-small); color: var(--muted); max-width: 30em; }
.team__next a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.team__name { font-size: clamp(4rem, 11vw, 8rem); line-height: 1; padding-bottom: .2em; }
.team__name + .team__role { margin-top: .4rem; }
@media (max-width: 899px) { .team > .phone-col { order: 2; width: min(70%, 260px); } }
.team__tag { margin: .9rem 0 0; font: italic 400 clamp(1.2rem, 1.8vw, 1.5rem)/1.3 var(--serif); color: var(--accent); }
.team .body { font-size: 1.02rem; max-width: 36em; }

/* Credentials row, shared by Kea and Stephen */
.creds { list-style: none; margin: 1.6rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; max-width: 620px; }
.creds li { min-width: 0; padding-top: .8rem; border-top: 1px solid var(--rule); }
.creds b { display: block; font: 500 clamp(1.1rem, 1.9vw, 1.65rem)/1.1 var(--serif); color: var(--accent); }
.creds .label { display: block; margin-top: .45rem; font-size: .58rem; line-height: 1.45; letter-spacing: .18em; }

/* Meet Stephen */
.team--second .mate__tag { margin: 0 0 1rem; background: var(--prosecco); color: var(--plum-deep); }
.partners { margin: 1.4rem 0 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: .35rem .7rem; }
.partners .label { width: 100%; margin-bottom: .2rem; }
.partners b { font: 500 clamp(1.05rem, 1.7vw, 1.35rem)/1.2 var(--serif); color: var(--fg); letter-spacing: .02em; }
.partners i { font-style: normal; color: var(--accent); }
.second__also { margin: .9rem 0 0; font-size: .86rem; color: var(--muted); max-width: 34em; }
.second__side { display: grid; gap: 2rem; align-items: center; }
.second__side .phone-col { width: min(100%, 240px); }
.two ol { list-style: none; margin: .9rem 0 0; padding: 0; display: grid; gap: 1.1rem; }
.two li { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: .8rem; align-items: start; padding-top: .9rem; border-top: 1px solid var(--rule); }
.two__n { font: italic 400 1.6rem/1 var(--serif); color: var(--accent); }
.two b { display: block; font: 500 1.05rem/1.25 var(--serif); color: var(--fg); }
.two p { margin: .3rem 0 0; font-size: .84rem; line-height: 1.5; color: var(--muted); }
@media (min-width: 900px) {
  .team--second { grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 4rem; }
  .second__side { grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 2.2rem; }
  .second__side .phone-col { width: min(200px, 30vh); }
}

/* Wordmark lockup until the logo file is added */
.wordmark { display: inline-grid; justify-items: center; line-height: 1; font-family: var(--serif); }
.wordmark b { font-weight: 500; font-style: normal; font-size: 1.05rem; letter-spacing: .16em; text-transform: uppercase; }
.wordmark small { margin-top: .22rem; font-family: var(--sans); font-size: .42rem; letter-spacing: .42em; text-transform: uppercase; opacity: .85; }

/* ---------- The weekend: deliverables by event ---------- */
.wk__head { display: grid; gap: 1rem; margin-bottom: clamp(1.4rem, 3.4vh, 2.4rem); }
@media (min-width: 900px) { .wk__head { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4rem; align-items: end; } .wk__head .lead { margin: 0; } }
.wk__head .where { margin-top: 1rem; }
.wk__events { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; }
@media (min-width: 900px) { .wk__events { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr); gap: 1.2rem; align-items: stretch; } }
.evt { padding: clamp(1.1rem, 2.4vh, 1.6rem) 1.4rem; border: 1px solid var(--rule); border-radius: 18px; background: rgba(255, 255, 255, .35); min-width: 0; }
.evt--main { background: var(--plum); border-color: var(--plum); color: var(--ivory); --fg: var(--ivory); --muted: #e3cfd6; --accent: var(--prosecco); --rule: rgba(247, 240, 231, .2); box-shadow: 0 24px 50px -28px rgba(42, 12, 31, .7); }
.evt__day { color: var(--accent); }
.evt__it { margin: .5rem 0 0; font: italic 400 clamp(1.5rem, 2.3vw, 2rem)/1.05 var(--serif); color: var(--fg); }
.evt__title { margin: .35rem 0 0; font: 600 1.02rem/1.25 var(--serif); letter-spacing: .02em; color: var(--fg); }
.evt__hours { margin: .9rem 0 0; padding-top: .8rem; border-top: 1px solid var(--rule); font: italic 400 1.15rem/1.2 var(--serif); color: var(--accent); }
.evt__list { list-style: none; margin: .6rem 0 0; padding: 0; display: grid; gap: .4rem; }
.evt__list li { position: relative; padding-left: 1rem; font-size: .86rem; line-height: 1.45; color: var(--muted); }
.evt__list li::before { content: ""; position: absolute; left: 0; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--prosecco); }
.wk__promises { list-style: none; margin: clamp(1.2rem, 3vh, 2rem) 0 0; padding: 0; display: grid; gap: 1rem; }
@media (min-width: 700px) { .wk__promises { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2rem; } }
.wk__promises li { display: grid; grid-template-columns: auto 1fr; column-gap: .8rem; align-items: baseline; border-top: 1px solid var(--rule); padding-top: .8rem; }
.wk__promises b { font: 500 clamp(1.3rem, 2vw, 1.7rem)/1 var(--serif); color: var(--plum); white-space: nowrap; }
.wk__promises p { grid-column: 1 / -1; margin: .35rem 0 0; font-size: .8rem; color: var(--muted); line-height: 1.45; }

/* Archive band: the raw footage as their library */
.archive { margin-top: clamp(1rem, 2.6vh, 1.6rem); display: grid; gap: 1.2rem; padding: clamp(1rem, 2.4vh, 1.4rem) 1.4rem; border-radius: 18px; background: var(--blush-soft); border: 1px solid rgba(79, 26, 62, .12); }
@media (min-width: 900px) { .archive { grid-template-columns: minmax(0, 1.5fr) minmax(0, .8fr); gap: 2.4rem; align-items: center; } }
.archive__label { margin: 0; color: var(--plum); }
.archive__title { margin: .4rem 0 0; font: italic 400 clamp(1.4rem, 2.4vw, 2rem)/1.1 var(--serif); color: var(--plum); }
.archive__line { margin: .5rem 0 0; font-size: .9rem; line-height: 1.55; color: var(--fg); max-width: 44em; }
.archive__uses { list-style: none; margin: .7rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
.archive__uses li { font: 500 .6rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; padding: .5rem .7rem; border-radius: 999px; background: rgba(255, 255, 255, .6); color: var(--plum); }
.archive__stats { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.archive__stats li { border-top: 1px solid rgba(79, 26, 62, .2); padding-top: .6rem; min-width: 0; }
.archive__stats b { display: block; font: 500 clamp(1.3rem, 2vw, 1.7rem)/1 var(--serif); color: var(--plum); }
.archive__stats .label { display: block; margin-top: .4rem; font-size: .56rem; }
.archive__stats p { margin: .3rem 0 0; font-size: .74rem; line-height: 1.4; color: var(--muted); }
.plan__library { margin: .9rem 0 0; font: italic 400 1.1rem/1.4 var(--serif); color: var(--plum); max-width: 30em; }

/* ---------- Content plan: sample Notion-style plan ---------- */
.plan { display: grid; gap: 2rem; align-items: center; }
@media (min-width: 1000px) { .plan { grid-template-columns: minmax(0, 1.3fr) minmax(0, .7fr); gap: 3.5rem; } }
.plan > * { min-width: 0; }
@media (max-width: 999px) { .plan__visual { order: 2; } }
.plan .display { font-size: clamp(2rem, 3.6vw, 3rem); }
.plan .lead { font-size: .98rem; }
.plan__label { display: block; margin-top: 1.4rem; color: var(--accent); }
.plan__list { list-style: none; margin: .6rem 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: .1rem 1.2rem; }
.plan__list li { padding: .42rem 0; border-top: 1px solid var(--rule); font-size: .82rem; line-height: 1.35; color: var(--fg); }
.np__fit { position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 30px 60px -30px rgba(42, 12, 31, .55), 0 0 0 1px rgba(26, 18, 22, .08); }
.np__win { width: 900px; transform-origin: 0 0; background: #fff; color: #37352f; font: 400 12px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0; text-transform: none; }
.np__bar { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-bottom: 1px solid #ededeb; background: #fbfbfa; }
.np__bar i { width: 10px; height: 10px; border-radius: 50%; background: #e3e2e0; }
.np__bar i:first-child { background: #ff5f57; } .np__bar i:nth-child(2) { background: #febc2e; } .np__bar i:nth-child(3) { background: #28c840; }
.np__crumbs { margin-left: 12px; color: #787774; font-size: 12px; }
.np__crumbs em { font-style: normal; margin: 0 4px; color: #c7c6c4; }
.np__share { margin-left: auto; color: #787774; }
.np__page { padding: 22px 34px 26px; }
.np__icon svg { width: 40px; height: 40px; display: block; }
.np__title { margin: 10px 0 10px; font: 700 26px/1.2 ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #37352f; letter-spacing: -.01em; }
.np__props { margin: 0 0 14px; display: grid; gap: 4px; }
.np__props div { display: grid; grid-template-columns: 110px 1fr; }
.np__props dt { color: #9b9a97; } .np__props dd { margin: 0; }
.np__views { display: flex; gap: 14px; align-items: center; border-bottom: 1px solid #ededeb; padding-bottom: 6px; margin-bottom: 0; color: #9b9a97; font-weight: 500; }
.np__views .on { color: #37352f; box-shadow: 0 8px 0 -6px #37352f; }
.np__new { margin-left: auto; background: #2383e2; color: #fff; border-radius: 4px; padding: 2px 8px; }
.np__table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.np__table th { text-align: left; font-weight: 400; color: #9b9a97; padding: 7px 6px; border-bottom: 1px solid #ededeb; white-space: nowrap; }
.np__table td { padding: 5px 6px; border-bottom: 1px solid #f1f1ef; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np__table th:nth-child(1) { width: 172px; } .np__table th:nth-child(2) { width: 96px; } .np__table th:nth-child(3) { width: 74px; }
.np__table th:nth-child(4) { width: 58px; } .np__table th:nth-child(5) { width: 182px; } .np__table th:nth-child(6) { width: 92px; }
.np__table th:nth-child(7) { width: 66px; }
.np__table td b { font-weight: 600; }
.np__chip { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11.5px; line-height: 1.5; }
.np__chip--kea { background: #f5e0e9; color: #4c2337; } .np__chip--stephen { background: #e8deee; color: #412454; } .np__chip--both { background: #d3e5ef; color: #183347; }
.np__chip--high { background: #ffe2dd; color: #5d1715; } .np__chip--medium { background: #fdecc8; color: #402c1b; }
.np__chip--planned { background: #dbeddb; color: #1c3829; } .np__chip--draft { background: #fdecc8; color: #402c1b; } .np__chip--idea { background: #e3e2e0; color: #32302c; }
.np__chip--video { background: #fadec9; color: #49290e; } .np__chip--story { background: #f5e0e9; color: #4c2337; } .np__chip--raw { background: #e3e2e0; color: #32302c; }
.np__note { margin: .8rem 0 0; font-size: .74rem; color: var(--muted); font-style: italic; }
.np__shot { margin: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(42, 12, 31, .55); }
.np__shot img { width: 100%; height: auto; }

/* ---------- Meet Kea: founder weight ---------- */
.team--lead .team__name { font-size: clamp(4.2rem, 11vw, 7.4rem); }
.team--lead .team__next { margin-top: 1.4rem; padding-top: .9rem; }
.team--lead .team__tag { font-size: clamp(1.35rem, 2.2vw, 1.9rem); }
.team--lead .body { margin-top: .9rem; }
.team--lead .body + .body { margin-top: .7rem; }
.creds--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 680px; }
@media (min-width: 700px) { .creds--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 900px) { .team--lead { grid-template-columns: minmax(0, .62fr) minmax(0, 1.38fr); gap: 4.5rem; } .team--lead .phone-col { width: min(100%, 300px, 44vh); } }
.team--second .team__name { font-size: clamp(3.4rem, 8vw, 6rem); }

/* ---------- Choose your coverage ---------- */
.opts__head { margin-bottom: clamp(1.2rem, 3vh, 2rem); }
.opts__head .display { font-size: clamp(1.9rem, 3.8vw, 3.2rem); }
.offers { display: grid; gap: 1.2rem; align-items: stretch; }
@media (min-width: 900px) { .offers { grid-template-columns: minmax(0, .82fr) minmax(0, 1.18fr); gap: 1.6rem; } }
.offer { position: relative; display: flex; flex-direction: column; padding: clamp(1.2rem, 2.6vh, 1.8rem) 1.6rem; border: 1px solid var(--rule); border-radius: 20px; background: rgba(255, 255, 255, .4); transition: border-color .5s var(--ease), box-shadow .5s var(--ease), transform .5s var(--ease); min-width: 0; }
.offer--rec { background: var(--plum); border-color: var(--plum); color: var(--ivory); --fg: var(--ivory); --muted: #e3cfd6; --accent: var(--prosecco); --rule: rgba(247, 240, 231, .2); }
.offer.is-selected { box-shadow: 0 0 0 2px var(--prosecco), 0 28px 60px -30px rgba(42, 12, 31, .7); }
@media (max-width: 899px) { .offer--two { order: -1; } .offer__badge { position: static !important; align-self: flex-start; margin: 0 0 .8rem !important; } }
.offer__badge { position: absolute; top: -.8rem; left: 1.6rem; margin: 0; padding: .45rem .8rem; border-radius: 999px; background: var(--prosecco); color: var(--plum-deep); font: 600 .6rem/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; }
.offer__tab { margin: 0; color: var(--accent); }
.offer__tab span { color: var(--fg); }
.offer__title { margin: .6rem 0 0; font: 600 clamp(1.15rem, 1.8vw, 1.55rem)/1.2 var(--serif); letter-spacing: .02em; color: var(--fg); }
.offer__price { margin: .8rem 0 0; display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; font: 500 clamp(2.2rem, 4vw, 3.2rem)/1 var(--serif); color: var(--plum); }
.offer--rec .offer__price { color: var(--ivory); }
.offer__price .label { font-size: .58rem; }
.offer__line { margin: .9rem 0 0; font-size: .9rem; line-height: 1.55; color: var(--muted); }
.offer__points { list-style: none; margin: .8rem 0 0; padding: 0; display: grid; gap: .35rem; }
.offer__points li { position: relative; padding-left: 1rem; font-size: .84rem; line-height: 1.45; color: var(--fg); }
.offer__points li::before { content: ""; position: absolute; left: 0; top: .6em; width: 5px; height: 5px; border-radius: 50%; background: var(--prosecco); }
.offer__closer { margin: .9rem 0 0; font: italic 400 1.08rem/1.4 var(--serif); color: var(--accent); }
.offer__pick { margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: .6rem; padding: .75rem 1.1rem; margin-block-start: 1.1rem; border: 1px solid var(--rule); border-radius: 999px; font: 500 .64rem/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--fg); }
.offer__dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid currentColor; display: grid; place-items: center; }
.offer__pick[aria-checked="true"] { border-color: var(--accent); color: var(--accent); }
.offer__pick[aria-checked="true"] .offer__dot::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.opts__foot { margin: 1.2rem 0 0; padding-top: .9rem; border-top: 1px solid var(--rule); font-size: .8rem; line-height: 1.55; color: var(--muted); max-width: 70em; }

/* ---------- Travel and logistics ---------- */
.lg__head { max-width: 760px; }
.lg__head .display { font-size: clamp(2rem, 4.4vw, 3.6rem); }
.lg__items { list-style: none; margin: clamp(1.6rem, 4vh, 2.6rem) 0 0; padding: 0; display: grid; gap: 1.4rem; }
@media (min-width: 700px) { .lg__items { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .lg__items { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2rem; } }
.lg__items li { border-top: 1px solid var(--fg); padding-top: 1.1rem; min-width: 0; }
.lg__items h3 { margin: .8rem 0 0; font: 600 1.25rem/1.15 var(--serif); letter-spacing: .02em; }
.lg__items p { margin: .5rem 0 0; font-size: .9rem; line-height: 1.55; color: var(--muted); }
.lg__easy { margin-top: 1.8rem; padding: 1.1rem 1.4rem; border-radius: 16px; background: var(--blush-soft); display: grid; gap: .3rem; max-width: 760px; }
@media (min-width: 700px) { .lg__easy { grid-template-columns: auto 1fr; gap: 1.4rem; align-items: baseline; } }
.lg__easy b { font: italic 400 1.25rem/1.2 var(--serif); color: var(--plum); }
.lg__easy p { margin: 0; font-size: .9rem; color: var(--fg); }
.lg__after { margin: 1.2rem 0 0; font-size: .78rem; color: var(--muted); }

/* ---------- Client love: screenshot wall ---------- */
.love__head { display: grid; gap: .6rem; margin-bottom: clamp(1.4rem, 3.4vh, 2.4rem); }
@media (min-width: 900px) { .love__head { grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); align-items: end; gap: 3rem; } .love__head .eyebrow { grid-column: 1 / -1; } .love__head .lead { margin: 0 0 .4rem; } }
.love__wall { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; align-items: start; }
@media (min-width: 900px) { .love__wall { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1.1rem; } .love__wall > :nth-child(even) { margin-top: 2.4rem; } }
@media (max-width: 899px) { .love__wall > :nth-child(5) { grid-column: 1 / -1; max-width: 50%; justify-self: center; } }
.msg:not(.msg--img) { aspect-ratio: 9 / 15; display: flex; flex-direction: column; }
.msg:not(.msg--img) .msg__body { flex: 1; align-content: start; }
.msg { margin: 0; border-radius: 18px; background: #fff; box-shadow: 0 20px 44px -26px rgba(42, 12, 31, .5), 0 0 0 1px rgba(26, 18, 22, .06); overflow: hidden; min-width: 0; }
.msg--img img { width: 100%; height: auto; display: block; }
.msg__top { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 0 10px; border-bottom: 1px solid #efeff2; background: #f7f7f9; }
.msg__av { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(145deg, #d9d9df, #b9b9c2); }
.msg__name { width: 44%; height: 6px; border-radius: 3px; background: #dcdce2; }
.msg__body { display: grid; gap: 7px; padding: 14px 12px 12px; }
.msg__b { justify-self: start; width: var(--w); display: grid; gap: 5px; padding: 9px 11px; border-radius: 16px 16px 16px 5px; background: #e9e9eb; }
.msg__b i { display: block; height: 5px; border-radius: 3px; background: #cfcfd4; }
.msg__b i + i { width: 70%; }
.msg__b--me { justify-self: end; border-radius: 16px 16px 5px 16px; background: #3b8cf7; }
.msg__b--me i { background: rgba(255, 255, 255, .55); }
.msg figcaption { padding: 0 12px 12px; font-size: .66rem; color: #6b6470; }
.msg__b--time { justify-self: center; width: 30%; background: none; padding: 2px 0; }
.msg__b--time i { background: #e4e4e8; height: 4px; }

/* Real screenshots: wide crops, laid out as a loose three-column wall */
.love__wall--shots { display: block; columns: 1; column-gap: 1.2rem; }
@media (min-width: 700px) { .love__wall--shots { columns: 2; } }
@media (min-width: 1000px) { .love__wall--shots { columns: 3; } }
.love__wall--shots > .msg { break-inside: avoid; margin: 0 0 1.2rem !important; max-width: none !important; }
.love__wall--shots > .msg:nth-child(odd) { transform: rotate(-.6deg); }
.love__wall--shots > .msg:nth-child(even) { transform: rotate(.5deg); }
.msg--img { background: #f4f4f6; border-radius: 16px; }

/* ---------- Closing: why us ---------- */
.close { display: grid; gap: 2rem; align-items: center; }
@media (min-width: 900px) { .close { grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); gap: 5rem; } }
.close__title { margin: 0; font: italic 400 clamp(2.8rem, 7vw, 6rem)/1.02 var(--serif); letter-spacing: -.01em; color: var(--ivory); text-wrap: balance; }
.close__title .w { display: inline-block; }
.close__lake { margin: 1.2rem 0 0; font: 500 .7rem/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--prosecco); }
.close__copy .body { color: var(--muted); font-size: 1rem; }
.close__copy .body + .body { margin-top: .9rem; }
.close__two { margin: 1.3rem 0 0; font: italic 400 clamp(1.3rem, 2.1vw, 1.7rem)/1.3 var(--serif); color: var(--blush); max-width: 26em; }
.close__last { margin: 1.3rem 0 0; font-size: 1.02rem; color: var(--ivory); }
.close__sign { margin-top: 1.6rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 1.4rem; flex-wrap: wrap; }
.close__sig { font: italic 400 2.6rem/1 var(--serif); color: var(--prosecco); }

/* ---------- Shared bits kept from earlier layouts ---------- */
.where { display: inline-flex; align-items: center; gap: .6rem; margin-top: 1.6rem; font: 500 .7rem/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--accent); }
.where svg { width: 14px; height: 14px; }
.col__icon { display: block; width: 30px; height: 30px; color: var(--accent); }
.col__icon svg { width: 30px; height: 30px; }
.mate__tag { display: inline-block; margin-bottom: .5rem; font: 500 .58rem/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; padding: .4rem .6rem; border-radius: 999px; background: var(--plum); color: var(--ivory); }

/* ---------- Type switcher (review only; content.js typePicker) ---------- */
.type-btn {
  display: inline-flex; align-items: center; gap: .5rem;
  font: 500 .64rem/1 var(--sans); letter-spacing: .2em; text-transform: uppercase;
  padding: .55rem .8rem; border: 1px dashed var(--chrome-dim); border-radius: 999px;
}
.type-btn:hover { border-style: solid; }

/* ---------- Short screens: tighten so desktop slides fit without scroll ---------- */
@media (min-width: 900px) and (max-height: 820px) {
  :root { --fs-h2: clamp(2rem, 4.4vw, 3.8rem); }
}

/* ---------- Reduced motion: static, complete, no autoplay ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  .m__ph::before { display: none; }
}
@media (max-width: 480px) { .type-btn span { display: none; } .type-btn { padding: .5rem .65rem; } }

/* Fit tuning for the weekend and coverage slides at 16:9 */
@media (min-width: 900px) {
  .wk__head { margin-bottom: clamp(.9rem, 2.2vh, 1.6rem); }
  .wk .display { font-size: clamp(1.9rem, 3.8vw, 3.2rem); }
  .evt { padding-block: clamp(.9rem, 2vh, 1.3rem); }
  .evt__hours { margin-top: .7rem; padding-top: .6rem; }
  .opts__head { margin-bottom: clamp(1rem, 2.4vh, 1.6rem); }
  .offer__line { font-size: .86rem; }
  .offer__points { gap: .25rem; }
  .offer__closer { font-size: 1rem; }
}

/* ---------- Couture: heavy fashion Didone, masthead energy ---------- */
html[data-type="couture"] {
  --serif: "SJT Couture", "Bodoni 72", Didot, Georgia, serif;
  --fs-mega: clamp(3.1rem, 11.4vw, 9.8rem);
  --fs-h2: clamp(2rem, 4.9vw, 4.1rem);
}
html[data-type="couture"] .display,
html[data-type="couture"] .cover__h .roman { letter-spacing: -.005em; line-height: 1.04; }
html[data-type="couture"] .cover__h .italic,
html[data-type="couture"] .quote blockquote p,
html[data-type="couture"] .close__title { font-weight: 500; }

/* ---------- Villa: Roman inscription capitals, Lake Como stone ---------- */
html[data-type="villa"] {
  --serif: "SJT Villa", "Trajan Pro", "Cinzel", Georgia, serif;
  --sans: "SJT Villa Text", "Optima", "Candara", "Helvetica Neue", Arial, sans-serif;
  --fs-mega: clamp(2.7rem, 9.6vw, 8.2rem);
  --fs-h2: clamp(1.8rem, 4.2vw, 3.5rem);
  --fs-h3: clamp(1.25rem, 2.2vw, 1.8rem);
}
html[data-type="villa"] .display,
html[data-type="villa"] .cover__h .roman,
html[data-type="villa"] .day__title, html[data-type="villa"] .panel__title,
html[data-type="villa"] .hours h3, html[data-type="villa"] .col h3, html[data-type="villa"] .need h3,
html[data-type="villa"] .dayc__title { font-weight: 600; letter-spacing: .03em; line-height: 1.12; }
html[data-type="villa"] .cover__h .roman { letter-spacing: .02em; }
/* Cormorant's italic runs small: give the accent lines more size */
html[data-type="villa"] .cover__h .italic,
html[data-type="villa"] .quote blockquote p,
html[data-type="villa"] .close__title,
html[data-type="villa"] .day__it,
html[data-type="villa"] .evt__it,
html[data-type="villa"] .team__name { font-size-adjust: .5; }
html[data-type="villa"] body { font-size: .97rem; }

/* ---------- Modern: architectural grotesque, editorial italic accents ---------- */
html[data-type="modern"] {
  --serif: "SJT Modern", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --sans: "SJT Modern Text", "Helvetica Neue", Arial, sans-serif;
  --fs-mega: clamp(2.9rem, 10.4vw, 9rem);
  --fs-h2: clamp(1.9rem, 4.4vw, 3.7rem);
}
html[data-type="modern"] .display,
html[data-type="modern"] .cover__h .roman,
html[data-type="modern"] .day__title, html[data-type="modern"] .panel__title,
html[data-type="modern"] .hours h3, html[data-type="modern"] .col h3, html[data-type="modern"] .need h3,
html[data-type="modern"] .dayc__title, html[data-type="modern"] .price__num,
html[data-type="modern"] .steps .amt, html[data-type="modern"] .beats b, html[data-type="modern"] .stat__v b { font-weight: 700; letter-spacing: -.035em; line-height: 1; }
html[data-type="modern"] .cover__h .italic,
html[data-type="modern"] .quote blockquote p,

html[data-type="modern"] .day__it,

/* Print / PDF: one slide per 16:9 page, every state shown at once.

@page { size: 1600px 900px; margin: 0; }

html, body { height: auto !important; overflow: visible !important; background: var(--ivory) !important; }
* { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; animation: none !important; transition: none !important; }

.intro, .chrome, .menu, #live, .m__sound, .intro__skip { display: none !important; }

.deck { position: static !important; overflow: visible !important; }
.slide {
  position: relative !important; inset: auto !important;
  visibility: visible !important;
  width: 1600px; height: 900px;
  overflow: hidden !important;
  clip-path: none !important; opacity: 1 !important; transform: none !important;
  break-after: page; page-break-after: always;
}
.slide:last-child { break-after: auto; page-break-after: auto; }
.slide [data-a], .slide .m, .slide .w { opacity: 1 !important; filter: none !important; transform: none !important; clip-path: none !important; }
.slide__body { min-height: 900px; height: 900px; padding-block: 64px 80px; }

/* Folio with a clickable way back to the contents page */
.folio {
  display: flex !important; justify-content: space-between; gap: 2rem;
  position: absolute; left: var(--gutter); right: var(--gutter); bottom: 26px; z-index: 5;
  font: 500 .62rem/1 var(--sans); letter-spacing: .26em; text-transform: uppercase;
  color: var(--muted); border-top: 1px solid var(--rule); padding-top: 12px;
}
.folio a { color: var(--accent); text-decoration: none; }
.folio__nav { display: flex; gap: 1.6rem; align-items: center; }
.folio__nav a { padding: 4px 0; border-bottom: 1px solid currentColor; }
.cover__begin { text-decoration: none; }
.s-cover .folio { border-color: transparent; }

/* Coverage: both offers are already side by side */
.offer__pick { display: none !important; }

.stamp svg { animation: none !important; }
